<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Kung Fu Brawler</title>
  <style>
    :root {
      --bg: #0d1020;
      --panel: rgba(8, 10, 20, 0.86);
      --line: rgba(255,255,255,0.12);
      --gold: #ffd54a;
      --red: #ff5d73;
      --blue: #5ad1ff;
      --ink: #f4f7fb;
      --game-width: 360px;
      --game-height: 640px;
      --shell-radius: 24px;
      --shell-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, #1d2954 0%, #0c1122 45%, #05070d 100%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    #shell {
      position: relative;
      width: min(
        var(--game-width),
        100%,
        calc(100vh * 0.5625)
      );
      aspect-ratio: 9 / 16;
      max-width: var(--game-width);
      max-height: var(--game-height);
      border-radius: var(--shell-radius);
      overflow: hidden;
      box-shadow: var(--shell-shadow);
      border: 1px solid rgba(255,255,255,0.12);
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    #hint {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.72);
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 6px 10px;
      pointer-events: none;
    }

    @media (max-width: 640px), (pointer: coarse) {
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="shell" aria-label="Kung Fu Brawler game container">
    <canvas id="game" width="360" height="640" aria-label="Kung Fu Brawler"></canvas>
    <div id="hint">Move: ← → / A D · Jump: ↑ / W / Space · Punch: J / K / X</div>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const W = 360;
      const H = 640;
      const GROUND_Y = 548;
      const TARGET_FPS = 60;
      const FIXED_DT = 1 / TARGET_FPS;
      const FRAME_TIME_MS = 1000 / TARGET_FPS;
      const MAX_FRAME_DELTA_MS = 100;
      const MAX_UPDATE_STEPS = 5;
      const PLAYER_MIN_X = 24;
      const PLAYER_MAX_X_PADDING = 32;
      const SPAWN_INTERVAL_MIN = 0.52;
      const SPAWN_INTERVAL_START = 1.25;
      const SPAWN_INTERVAL_RAMP = 0.015;
      const CONTROL_Y = H - 70;
      const CONTROL_CLUSTER_GAP = 66;
      const CONTROL_EDGE_OFFSET = 60;
      const CONTROL_LEFT_X = CONTROL_EDGE_OFFSET;
      const CONTROL_RIGHT_X = CONTROL_LEFT_X + CONTROL_CLUSTER_GAP;
      const CONTROL_ATTACK_X = W - CONTROL_EDGE_OFFSET;
      const CONTROL_JUMP_X = CONTROL_ATTACK_X - CONTROL_CLUSTER_GAP;
      const CONTROL_BUTTON_RADIUS = 28;
      const CONTROL_ATTACK_RADIUS = 30;
      const CONTROL_HIT_RADIUS = 34;
      const CONTROL_ATTACK_HIT_RADIUS = 36;

      const keys = Object.create(null);
      const touchState = { left: false, right: false, jump: false, attack: false };
      const pointers = new Map();

      const controls = {
        left: { key: 'left', x: CONTROL_LEFT_X, y: CONTROL_Y, r: CONTROL_BUTTON_RADIUS, hitR: CONTROL_HIT_RADIUS, label: '◀' },
        right: { key: 'right', x: CONTROL_RIGHT_X, y: CONTROL_Y, r: CONTROL_BUTTON_RADIUS, hitR: CONTROL_HIT_RADIUS, label: '▶' },
        jump: { key: 'jump', x: CONTROL_JUMP_X, y: CONTROL_Y, r: CONTROL_BUTTON_RADIUS, hitR: CONTROL_HIT_RADIUS, label: '▲' },
        attack: { key: 'attack', x: CONTROL_ATTACK_X, y: CONTROL_Y, r: CONTROL_ATTACK_RADIUS, hitR: CONTROL_ATTACK_HIT_RADIUS, label: '●' }
      };
      const controlList = Object.values(controls);

      const palette = {
        skyTop: '#162451',
        skyBottom: '#070b15',
        cityA: '#10182f',
        cityB: '#172142',
        floor: '#1b1d2d',
        floorLine: '#2d3150',
        neonA: '#46d2ff',
        neonB: '#ff4d88',
        hero: '#ffd34d',
        heroDark: '#5a3a15',
        enemy: '#ff6b6b',
        enemyDark: '#531f28',
        white: '#f7fbff',
        black: '#05070a',
        shadow: 'rgba(0,0,0,0.25)',
        hit: '#ffffff',
        hp: '#ff5d73',
        hpBack: 'rgba(255,255,255,0.14)',
        score: '#ffe37a'
      };

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }
      function approach(current, target, delta) {
        if (current < target) return Math.min(target, current + delta);
        if (current > target) return Math.max(target, current - delta);
        return current;
      }
      function rand(min, max) { return Math.random() * (max - min) + min; }

      function createPlayer() {
        return {
          x: 74,
          y: GROUND_Y - 78,
          w: 36,
          h: 78,
          vx: 0,
          vy: 0,
          dir: 1,
          speed: 235,
          jumpPower: 470,
          gravity: 1180,
          onGround: true,
          health: 100,
          maxHealth: 100,
          attackTimer: 0,
          attackCooldown: 0,
          attackDuration: 0.19,
          attackWindowStart: 0.04,
          attackWindowEnd: 0.13,
          attackPressedLatch: false,
          hurtTimer: 0,
          hitFlash: 0,
          invuln: 0,
          bob: 0,
          comboPulse: 0,
          alive: true
        };
      }

      function createEnemy(scoreScale = 0) {
        const elite = Math.random() < Math.min(0.35, scoreScale * 0.018);
        const w = elite ? 42 : 34;
        const h = elite ? 86 : 76;
        const health = elite ? 52 : 30;
        return {
          x: W + rand(20, 120),
          y: GROUND_Y - h,
          w,
          h,
          vx: 0,
          vy: 0,
          dir: -1,
          speed: elite ? rand(72, 92) : rand(88, 114),
          health,
          maxHealth: health,
          attackRange: elite ? 48 : 42,
          attackWindup: elite ? 0.52 : 0.62,
          attackCooldown: rand(0.15, 0.5),
          attackTimer: 0,
          hurtTimer: 0,
          hitFlash: 0,
          dead: false,
          deathTimer: 0,
          worth: elite ? 25 : 10,
          elite
        };
      }

      const game = {
        player: createPlayer(),
        enemies: [],
        particles: [],
        score: 0,
        time: 0,
        spawnTimer: 0.9,
        spawnInterval: 1.2,
        comboText: '',
        comboTimer: 0,
        gameOver: false,
        restartTimer: 0,
        cameraShake: 0,
        lastTs: 0,
        accumulatorMs: 0
      };

      function resetGame() {
        game.player = createPlayer();
        game.enemies = [];
        game.particles = [];
        game.score = 0;
        game.time = 0;
        game.spawnTimer = 0.8;
        game.spawnInterval = 1.2;
        game.comboText = '';
        game.comboTimer = 0;
        game.gameOver = false;
        game.restartTimer = 0;
        game.cameraShake = 0;
        game.lastTs = 0;
        game.accumulatorMs = 0;
      }

      function inputAxis() {
        const left = keys.ArrowLeft || keys.KeyA || touchState.left;
        const right = keys.ArrowRight || keys.KeyD || touchState.right;
        return (right ? 1 : 0) - (left ? 1 : 0);
      }

      function jumpPressed() {
        return !!(keys.ArrowUp || keys.KeyW || keys.Space || touchState.jump);
      }

      function attackPressed() {
        return !!(keys.KeyJ || keys.KeyK || keys.KeyX || touchState.attack);
      }

      function triggerAttack() {
        const p = game.player;
        if (!p.alive) return;
        if (p.attackCooldown > 0 || p.attackTimer > 0) return;
        p.attackTimer = p.attackDuration;
        p.attackCooldown = 0.13;
        p.comboPulse = 0.22;
      }

      function spawnPunchBurst(x, y, dir) {
        for (let i = 0; i < 7; i++) {
          game.particles.push({
            x: x + rand(-4, 4),
            y: y + rand(-8, 8),
            vx: dir * rand(50, 150) + rand(-20, 20),
            vy: rand(-60, 60),
            life: rand(0.1, 0.18),
            maxLife: 0.18,
            color: i % 2 ? palette.hit : palette.score,
            size: rand(2, 4)
          });
        }
      }

      function spawnEnemyBurst(enemy) {
        for (let i = 0; i < 14; i++) {
          game.particles.push({
            x: enemy.x + enemy.w * 0.5,
            y: enemy.y + enemy.h * 0.45,
            vx: rand(-150, 150),
            vy: rand(-140, 50),
            life: rand(0.25, 0.45),
            maxLife: 0.45,
            color: enemy.elite ? palette.neonA : palette.enemy,
            size: rand(2, 5)
          });
        }
      }

      function spawnHitSpark(x, y, color) {
        for (let i = 0; i < 8; i++) {
          game.particles.push({
            x, y,
            vx: rand(-120, 120),
            vy: rand(-120, 70),
            life: rand(0.14, 0.3),
            maxLife: 0.3,
            color,
            size: rand(2, 4)
          });
        }
      }

      function applyPlayerHit(damage, sourceX) {
        const p = game.player;
        if (!p.alive || p.invuln > 0) return;
        p.health = Math.max(0, p.health - damage);
        p.hurtTimer = 0.22;
        p.hitFlash = 0.18;
        p.invuln = 0.45;
        p.vx = sourceX < p.x ? 110 : -110;
        p.vy = -70;
        game.cameraShake = Math.max(game.cameraShake, 6);
        spawnHitSpark(p.x + p.w * 0.5, p.y + 24, palette.red);
        if (p.health <= 0) {
          p.alive = false;
          game.gameOver = true;
          game.restartTimer = 0.4;
        }
      }

      function attackHitbox() {
        const p = game.player;
        return {
          x: p.dir > 0 ? p.x + p.w - 2 : p.x - 34,
          y: p.y + 16,
          w: 34,
          h: 22
        };
      }

      function updatePlayer(dt) {
        const p = game.player;
        p.hitFlash = Math.max(0, p.hitFlash - dt);
        p.hurtTimer = Math.max(0, p.hurtTimer - dt);
        p.invuln = Math.max(0, p.invuln - dt);
        p.attackCooldown = Math.max(0, p.attackCooldown - dt);
        p.comboPulse = Math.max(0, p.comboPulse - dt);
        p.bob += dt * (Math.abs(p.vx) > 8 && p.onGround ? 12 : 5);

        if (!p.alive) {
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.y + p.h >= GROUND_Y) {
            p.y = GROUND_Y - p.h;
            p.vy = 0;
          }
          return;
        }

        const axis = inputAxis();
        const desired = axis * p.speed;
        const accel = p.onGround ? 980 : 650;
        p.vx = approach(p.vx, desired, accel * dt);

        if (axis !== 0) p.dir = axis > 0 ? 1 : -1;

        const jumpNow = jumpPressed();
        if (jumpNow && p.onGround) {
          p.vy = -p.jumpPower;
          p.onGround = false;
        }

        const attackNow = attackPressed();
        if (attackNow && !p.attackPressedLatch) triggerAttack();
        p.attackPressedLatch = attackNow;

        if (p.attackTimer > 0) {
          const prev = p.attackTimer;
          p.attackTimer = Math.max(0, p.attackTimer - dt);
          const elapsed = p.attackDuration - p.attackTimer;
          const prevElapsed = p.attackDuration - prev;
          const activeNow = elapsed >= p.attackWindowStart && elapsed <= p.attackWindowEnd;
          const wasActive = prevElapsed >= p.attackWindowStart && prevElapsed <= p.attackWindowEnd;
          if (activeNow || (!wasActive && elapsed > p.attackWindowStart)) {
            const hb = attackHitbox();
            let hits = 0;
            for (const enemy of game.enemies) {
              if (enemy.dead || enemy.hurtTimer > 0) continue;
              if (rectsOverlap(hb, enemy)) {
                enemy.health -= enemy.elite ? 18 : 16;
                enemy.hurtTimer = 0.18;
                enemy.hitFlash = 0.16;
                enemy.vx = p.dir * (enemy.elite ? 85 : 120);
                hits++;
                spawnPunchBurst(hb.x + (p.dir > 0 ? hb.w : 0), hb.y + 6, p.dir);
                spawnHitSpark(enemy.x + enemy.w * 0.5, enemy.y + 24, palette.score);
                game.cameraShake = Math.max(game.cameraShake, 4);
                if (enemy.health <= 0) {
                  enemy.dead = true;
                  enemy.deathTimer = 0.4;
                  game.score += enemy.worth;
                  spawnEnemyBurst(enemy);
                }
              }
            }
            if (hits >= 2) {
              game.comboText = 'COMBO x' + hits;
              game.comboTimer = 0.55;
            }
          }
        }

        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        if (p.y + p.h >= GROUND_Y) {
          p.y = GROUND_Y - p.h;
          p.vy = 0;
          p.onGround = true;
        }

        p.x = clamp(p.x, PLAYER_MIN_X, W - p.w - PLAYER_MAX_X_PADDING);
      }

      function updateEnemies(dt) {
        const p = game.player;
        for (let i = game.enemies.length - 1; i >= 0; i--) {
          const e = game.enemies[i];
          e.hitFlash = Math.max(0, e.hitFlash - dt);
          e.hurtTimer = Math.max(0, e.hurtTimer - dt);

          if (e.dead) {
            e.deathTimer -= dt;
            e.x += e.vx * dt;
            e.vx *= 0.9;
            if (e.deathTimer <= 0) game.enemies.splice(i, 1);
            continue;
          }

          const centerDist = (p.x + p.w * 0.5) - (e.x + e.w * 0.5);
          e.dir = centerDist >= 0 ? 1 : -1;
          e.attackCooldown = Math.max(0, e.attackCooldown - dt);

          const closeEnough = Math.abs(centerDist) < e.attackRange + p.w * 0.35;
          if (!closeEnough && p.alive) {
            e.vx = e.dir * e.speed;
          } else {
            e.vx = approach(e.vx, 0, 1000 * dt);
            if (e.attackCooldown <= 0 && p.alive) {
              e.attackTimer += dt;
              if (e.attackTimer >= e.attackWindup) {
                e.attackTimer = 0;
                e.attackCooldown = e.elite ? 0.85 : 1.0;
                const hitbox = {
                  x: e.dir > 0 ? e.x + e.w - 6 : e.x - 18,
                  y: e.y + 18,
                  w: 24,
                  h: 22
                };
                if (rectsOverlap(hitbox, p)) applyPlayerHit(e.elite ? 14 : 9, e.x);
              }
            } else {
              e.attackTimer = 0;
            }
          }

          e.x += e.vx * dt;

          if (e.x < -80) game.enemies.splice(i, 1);
        }
      }

      function updateSpawner(dt) {
        if (game.gameOver) return;
        game.spawnInterval = Math.max(SPAWN_INTERVAL_MIN, SPAWN_INTERVAL_START - game.time * SPAWN_INTERVAL_RAMP);
        game.spawnTimer -= dt;
        if (game.spawnTimer <= 0) {
          const cap = game.score > 100 ? 6 : 5;
          if (game.enemies.filter(e => !e.dead).length < cap) {
            game.enemies.push(createEnemy(game.score));
          }
          game.spawnTimer = game.spawnInterval * rand(0.85, 1.15);
        }
      }

      function updateParticles(dt) {
        for (let i = game.particles.length - 1; i >= 0; i--) {
          const p = game.particles[i];
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 220 * dt;
          p.vx *= 0.985;
          if (p.life <= 0) game.particles.splice(i, 1);
        }
      }

      function update(dt) {
        game.time += dt;
        game.cameraShake = Math.max(0, game.cameraShake - dt * 18);
        game.comboTimer = Math.max(0, game.comboTimer - dt);
        if (game.gameOver) game.restartTimer = Math.max(0, game.restartTimer - dt);

        updatePlayer(dt);
        updateSpawner(dt);
        updateEnemies(dt);
        updateParticles(dt);
      }

      function drawBackground(t) {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, palette.skyTop);
        grad.addColorStop(1, palette.skyBottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        for (let i = 0; i < 7; i++) {
          const x = (i * 58 + 10) % W;
          const h = 120 + (i % 3) * 40;
          ctx.fillStyle = i % 2 ? palette.cityA : palette.cityB;
          ctx.fillRect(x, 180 - h * 0.2, 42 + (i % 2) * 10, h);
          ctx.fillStyle = i % 2 ? 'rgba(70,210,255,0.2)' : 'rgba(255,77,136,0.17)';
          ctx.fillRect(x + 8, 210 - h * 0.15, 10, 3);
          ctx.fillRect(x + 22, 235 - h * 0.18, 12, 3);
        }

        ctx.fillStyle = '#090b13';
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

        for (let y = GROUND_Y; y < H; y += 18) {
          ctx.fillStyle = y % 36 === 0 ? palette.floorLine : palette.floor;
          ctx.fillRect(0, y, W, 18);
        }

        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let x = -40; x < W + 60; x += 28) {
          const shift = ((t * 80) % 28);
          ctx.beginPath();
          ctx.moveTo(x - shift, GROUND_Y);
          ctx.lineTo(x + 40 - shift, H);
          ctx.stroke();
        }

        ctx.fillStyle = 'rgba(70,210,255,0.16)';
        ctx.fillRect(0, GROUND_Y - 4, W, 4);
      }

      function drawShadow(x, y, w, alpha = 0.22) {
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.beginPath();
        ctx.ellipse(x, y, w, w * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawFighter(entity, isPlayer) {
        const flash = entity.hitFlash > 0;
        const dir = entity.dir;
        const x = Math.round(entity.x);
        const y = Math.round(entity.y);
        const body = isPlayer ? palette.hero : palette.enemy;
        const dark = isPlayer ? palette.heroDark : palette.enemyDark;
        const bob = isPlayer ? Math.sin(game.player.bob) * 1.5 : Math.sin((game.time + x) * 8) * 0.8;
        const attacking = isPlayer && entity.attackTimer > 0;
        const attackSwing = attacking ? Math.sin((1 - entity.attackTimer / entity.attackDuration) * Math.PI) : 0;
        const lean = clamp(entity.vx / 180, -1, 1) * 3;

        drawShadow(x + entity.w / 2, GROUND_Y + 3, entity.w * (isPlayer ? 0.54 : 0.5));

        ctx.save();
        ctx.translate(x + entity.w / 2, y + entity.h / 2 + bob);
        ctx.scale(dir, 1);
        ctx.translate(-(x + entity.w / 2), -(y + entity.h / 2));

        if (flash) {
          ctx.fillStyle = palette.hit;
          ctx.globalAlpha = 0.6;
          ctx.fillRect(x - 4, y - 4, entity.w + 8, entity.h + 8);
          ctx.globalAlpha = 1;
        }

        ctx.fillStyle = dark;
        ctx.fillRect(x + 11 + lean * 0.4, y + 14, 16, 28);

        ctx.fillStyle = body;
        ctx.fillRect(x + 9 + lean * 0.6, y + 10, 18, 32);

        ctx.fillStyle = dark;
        ctx.fillRect(x + 12, y + 43, 6, 22);
        ctx.fillRect(x + 20, y + 43, 6, 22);

        ctx.fillStyle = body;
        ctx.fillRect(x + 11, y + 42, 7, 21);
        ctx.fillRect(x + 20, y + 42, 7, 21);

        const frontArmY = y + 20;
        const backArmY = y + 18;
        ctx.fillStyle = dark;
        ctx.fillRect(x + 6, backArmY, 7, 18);
        ctx.fillRect(x + 24, frontArmY, attacking ? 11 + attackSwing * 12 : 8, 8);

        ctx.fillStyle = body;
        ctx.fillRect(x + 6, backArmY, 6, 16);
        ctx.fillRect(x + 24, frontArmY, attacking ? 10 + attackSwing * 12 : 7, 7);

        ctx.fillStyle = dark;
        ctx.fillRect(x + 9, y + 2, 20, 16);
        ctx.fillStyle = flash ? palette.white : (isPlayer ? '#ffe7a0' : '#ffc4c4');
        ctx.fillRect(x + 10, y + 3, 18, 14);

        ctx.fillStyle = palette.black;
        ctx.fillRect(x + 19, y + 8, 5, 3);
        ctx.fillRect(x + 25, y + 8, 2, 3);
        ctx.fillRect(x + 20, y + 13, 5, 2);

        if (!isPlayer && entity.elite) {
          ctx.fillStyle = palette.neonA;
          ctx.fillRect(x + 9, y + 0, 20, 2);
        }

        ctx.restore();
      }

      function drawParticles() {
        for (const p of game.particles) {
          ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.fillStyle = p.color;
          ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
        }
        ctx.globalAlpha = 1;
      }

      function drawUI() {
        ctx.fillStyle = 'rgba(5,7,10,0.6)';
        ctx.fillRect(14, 14, 240, 32);
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.strokeRect(14.5, 14.5, 239, 31);

        const hp = game.player.health / game.player.maxHealth;
        ctx.fillStyle = palette.hpBack;
        ctx.fillRect(20, 20, 150, 20);
        ctx.fillStyle = hp > 0.35 ? palette.hp : '#ffb347';
        ctx.fillRect(20, 20, Math.max(0, 150 * hp), 20);
        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.strokeRect(20.5, 20.5, 149, 19);

        ctx.fillStyle = palette.white;
        ctx.font = 'bold 12px Arial';
        ctx.fillText(`HP ${game.player.health}/${game.player.maxHealth}`, 176, 34);

        ctx.textAlign = 'right';
        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = palette.score;
        ctx.fillText(String(game.score).padStart(4, '0'), W - 18, 36);
        ctx.textAlign = 'left';

        if (game.comboTimer > 0) {
          ctx.globalAlpha = clamp(game.comboTimer / 0.55, 0, 1);
          ctx.fillStyle = palette.score;
          ctx.font = 'bold 16px Arial';
          ctx.fillText(game.comboText, 20, 64);
          ctx.globalAlpha = 1;
        }
      }

      function drawControls() {
        const alpha = 0.92;

        for (const control of controlList) {
          const active = touchState[control.key] ||
            (control.key === 'left' && (keys.ArrowLeft || keys.KeyA)) ||
            (control.key === 'right' && (keys.ArrowRight || keys.KeyD)) ||
            (control.key === 'jump' && (keys.ArrowUp || keys.KeyW || keys.Space)) ||
            (control.key === 'attack' && (keys.KeyJ || keys.KeyK || keys.KeyX));

          ctx.globalAlpha = alpha;
          ctx.fillStyle = active ? 'rgba(255, 213, 74, 0.42)' : 'rgba(255,255,255,0.12)';
          ctx.beginPath();
          ctx.arc(control.x, control.y, control.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = active ? 'rgba(255, 213, 74, 0.9)' : 'rgba(255,255,255,0.18)';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = active ? palette.white : 'rgba(255,255,255,0.82)';
          ctx.font = control.key === 'attack' ? 'bold 18px Arial' : 'bold 16px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(control.label, control.x, control.y + 1);
        }

        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.globalAlpha = 1;
      }

      function drawOverlay() {
        if (!game.gameOver) return;
        ctx.fillStyle = 'rgba(4,6,10,0.56)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = palette.white;
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px Arial';
        ctx.fillText('YOU FELL', W / 2, 255);
        ctx.font = 'bold 16px Arial';
        ctx.fillStyle = palette.score;
        ctx.fillText('Score ' + game.score, W / 2, 288);
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.font = '14px Arial';
        const ready = game.restartTimer <= 0;
        ctx.fillText(ready ? 'Tap attack or press Enter to restart' : '...', W / 2, 320);
        ctx.textAlign = 'left';
      }

      function render() {
        ctx.save();
        if (game.cameraShake > 0) {
          ctx.translate(rand(-game.cameraShake, game.cameraShake), rand(-game.cameraShake, game.cameraShake));
        }

        drawBackground(game.time);

        const entities = [game.player, ...game.enemies.filter(e => !e.dead), ...game.enemies.filter(e => e.dead)];
        entities.sort((a, b) => (a.y + a.h) - (b.y + b.h));
        for (const entity of entities) {
          drawFighter(entity, entity === game.player);
        }

        if (game.player.attackTimer > 0 && game.player.alive) {
          const hb = attackHitbox();
          ctx.fillStyle = 'rgba(255,227,122,0.12)';
          ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
        }

        drawParticles();
        drawUI();
        drawControls();
        drawOverlay();
        ctx.restore();
      }

      function loop(ts) {
        if (!game.lastTs) {
          game.lastTs = ts;
          render();
          requestAnimationFrame(loop);
          return;
        }

        const frameDeltaMs = Math.min(ts - game.lastTs, MAX_FRAME_DELTA_MS);
        game.lastTs = ts;
        game.accumulatorMs += frameDeltaMs;

        let steps = 0;
        while (game.accumulatorMs >= FRAME_TIME_MS && steps < MAX_UPDATE_STEPS) {
          update(FIXED_DT);
          game.accumulatorMs -= FRAME_TIME_MS;
          steps++;
        }

        if (steps === MAX_UPDATE_STEPS) {
          game.accumulatorMs = 0;
        }

        render();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        if ([ 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space' ].includes(e.code) || ['Space'].includes(e.key)) e.preventDefault();
        keys[e.code] = true;
        if (e.code === 'Enter' && game.gameOver && game.restartTimer <= 0) resetGame();
      }, { passive: false });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      function controlAt(px, py) {
        const rect = canvas.getBoundingClientRect();
        const x = (px - rect.left) * (W / rect.width);
        const y = (py - rect.top) * (H / rect.height);

        for (const control of controlList) {
          const dx = x - control.x;
          const dy = y - control.y;
          if (dx * dx + dy * dy <= control.hitR * control.hitR) return control.key;
        }

        if (game.gameOver && game.restartTimer <= 0) return 'restart';
        return null;
      }

      function clearPointer(id) {
        const existing = pointers.get(id);
        if (existing && touchState[existing]) touchState[existing] = false;
        pointers.delete(id);
      }

      function onPointerDown(e) {
        e.preventDefault();
        canvas.setPointerCapture?.(e.pointerId);
        const control = controlAt(e.clientX, e.clientY);
        if (control === 'restart') {
          resetGame();
          return;
        }
        if (!control) return;
        pointers.set(e.pointerId, control);
        touchState[control] = true;
      }

      function onPointerMove(e) {
        if (!pointers.has(e.pointerId)) return;
        e.preventDefault();
        const next = controlAt(e.clientX, e.clientY);
        const prev = pointers.get(e.pointerId);
        if (prev && prev !== 'restart') touchState[prev] = false;
        if (next && next !== 'restart') {
          pointers.set(e.pointerId, next);
          touchState[next] = true;
        } else {
          pointers.delete(e.pointerId);
        }
      }

      function onPointerUp(e) {
        e.preventDefault();
        clearPointer(e.pointerId);
      }

      canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
      canvas.addEventListener('pointermove', onPointerMove, { passive: false });
      canvas.addEventListener('pointerup', onPointerUp, { passive: false });
      canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      window.addEventListener('blur', () => {
        for (const key in keys) keys[key] = false;
        for (const key in touchState) touchState[key] = false;
        pointers.clear();
      });

      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
