      const audio = new TinyMusic();
      audio.ensure();

      function pressLeft() { return !!(keys.ArrowLeft || keys.KeyA || touchState.left); }
      function pressRight() { return !!(keys.ArrowRight || keys.KeyD || touchState.right); }
      function pressJump() { return !!(keys.ArrowUp || keys.KeyW || keys.Space || touchState.jump); }
      function pressPunch() { return !!(keys.KeyJ || touchState.punch); }
      function pressKick() { return !!(keys.KeyK || keys.KeyX || touchState.kick); }
      function pressParry() { return !!(keys.KeyP || keys.ShiftLeft || keys.ShiftRight || touchState.parry); }
      function axisInput() { return (pressRight() ? 1 : 0) - (pressLeft() ? 1 : 0); }

      function recycleParticle(index) {
        const particle = game.particlePool.active[index];
        if (!particle) return;
        particle.active = false;
        const last = game.particlePool.active.pop();
        if (index < game.particlePool.active.length) game.particlePool.active[index] = last;
        game.particlePool.free.push(particle);
      }

      function spawnParticle(x, y, color, size, life, vx, vy, gravity = 220) {
        const pool = game.particlePool;
        let particle = pool.free.pop();
        if (!particle) {
          if (!pool.active.length) return;
          particle = pool.active.shift();
        }
        particle.active = true;
        particle.x = x;
        particle.y = y;
        particle.color = color;
        particle.size = size;
        particle.life = life;
        particle.maxLife = life;
        particle.vx = vx;
        particle.vy = vy;
        particle.gravity = gravity;
        particle.alphaBucket = 1;
        pool.active.push(particle);
      }

      function burst(x, y, color, count, speedMin, speedMax, sizeMin = 2, sizeMax = 4) {
        for (let i = 0; i < count; i++) {
          const ang = rand(-Math.PI, Math.PI);
          const sp = rand(speedMin, speedMax);
          spawnParticle(x, y, color, rand(sizeMin, sizeMax), rand(0.12, 0.34), Math.cos(ang) * sp, Math.sin(ang) * sp - 20);
        }
      }
      function flash(color, alpha, life) {
        game.flashes.push({ color, alpha, life, maxLife: life });
      }

      function setPlayerState(nextState) {
        const p = game.player;
        if (p.state !== nextState) {
          p.state = nextState;
          p.stateTime = 0;
        }
      }

      function validatePlayerCombatState() {
        const p = game.player;
        if (p.attack && p.attack.timer < -CONFIG.animation.attackGraceTime) p.attack = null;
        if (p.parryTimer < 0) p.parryTimer = 0;
        if (!p.alive && p.health > 0) p.alive = true;
        if (p.alive && p.health <= 0) {
          p.health = 0;
          p.alive = false;
          setPlayerState('dead');
        }
      }

      function startAttack(type) {
        const p = game.player;
        if (!p.alive || p.hurtTimer > 0 || p.attack) return false;
        const def = CONFIG.player.attacks[type];
        if (!def || p.attackCooldowns[type] > 0) return false;
        p.attack = { type, timer: def.duration, hitDone: false, ...def };
        p.attackCooldowns[type] = CONFIG.player.attackCooldowns[type];
        setPlayerState(def.strikeState);
        audio.sfx(type);
        haptic(type === 'kick' ? CONFIG.haptics.kickMs : CONFIG.haptics.attackMs);
        return true;
      }

      function getAttackHitbox() {
        const p = game.player;
        if (!p.attack) return null;
        const a = p.attack;
        return {
          x: p.dir > 0 ? p.x + p.w - 4 : p.x - a.range,
          y: p.y + a.y,
          w: a.range,
          h: a.h
        };
      }

      function canParryAttack(enemy) {
        if (enemy.dead || enemy.stunTimer > 0) return false;
        if (enemy.projectile) return enemy.attackPhase === 'release' || (enemy.attackPhase === 'windup' && enemy.attackTimer >= enemy.attackWindup - 0.08);
        return enemy.attackPhase === 'windup' && enemy.attackTimer >= enemy.attackWindup - 0.26 && enemy.attackTimer <= enemy.attackWindup + 0.06;
      }

      function triggerParryCinematic(power = 1) {
        game.freezeTimer = Math.max(game.freezeTimer, CONFIG.player.parryFreezeTime * power);
        game.timeScale = Math.min(game.timeScale, CONFIG.player.parrySlowMoScale);
        game.timeScaleTimer = Math.max(game.timeScaleTimer, CONFIG.player.parrySlowMoTime * power);
      }

      function triggerParrySuccess(sourceX, options = {}) {
        const p = game.player;
        p.parrySuccess = Math.max(p.parrySuccess, CONFIG.player.parrySuccessTime * (options.projectile ? 1.08 : 1));
        p.parryGlow = Math.max(p.parryGlow, 0.38);
        p.parryFailTimer = 0;
        p.counterWindow = Math.max(p.counterWindow, options.counterWindow || CONFIG.player.counterWindow);
        p.invuln = Math.max(p.invuln, CONFIG.player.parryInvuln);
        flash(palette.white, CONFIG.fx.flashParry.alpha, CONFIG.fx.flashParry.life);
        burst(p.x + p.w * 0.5, p.y + 26, palette.green, options.projectile ? 24 : 20, 70, 210, 2, 5);
        burst(p.x + p.w * 0.5, p.y + 26, palette.gold, options.projectile ? 12 : 10, 40, 150, 2, 4);
        audio.sfx(options.projectile ? 'parryProjectile' : 'parrySuccess');
        haptic(CONFIG.haptics.parryMs);
        game.cameraShake = Math.max(game.cameraShake, CONFIG.fx.parryShake + (options.projectile ? 1 : 0));
        game.comboText = options.projectile ? 'PROJECTILE PARRY!' : 'PARRY!';
        game.comboTimer = CONFIG.player.comboTimer + 0.18;
        triggerParryCinematic(options.projectile ? 1.15 : 1);
        if (typeof sourceX === 'number') {
          burst(sourceX, p.y + 28, palette.white, options.projectile ? 12 : 8, 20, 120, 1, 3);
        }
      }

      function failParryFeedback() {
        const p = game.player;
        p.parryFailTimer = 0.18;
        flash(palette.red, CONFIG.fx.flashParryFail.alpha, CONFIG.fx.flashParryFail.life);
        burst(p.x + p.w * 0.5, p.y + 28, palette.red, 8, 30, 100, 1, 3);
        audio.sfx('parryFail');
      }

      function tryParry() {
        const p = game.player;
        if (!p.alive) return false;
        if (p.parryCooldown > 0) {
          failParryFeedback();
          return false;
        }
        p.parryTimer = CONFIG.player.parryWindow;
        p.parryCooldown = CONFIG.player.parryCooldown;
        p.parryGlow = Math.max(p.parryGlow, CONFIG.player.parryWindow + 0.08);
        p.parryFailTimer = 0;
        setPlayerState('parry');
        audio.sfx('parryReady');
        haptic(CONFIG.haptics.parryMs);
        return true;
      }

      function registerHit(text) {
        game.comboCount++;
        game.comboDecay = CONFIG.player.comboDecay;
        game.comboTimer = CONFIG.player.comboTimer;
        game.comboText = game.comboCount > 1 ? `COMBO x${game.comboCount}` : text;
      }

      function damageEnemy(enemy, amount, dir, color, knockBoost = 1) {
        if (enemy.dead) return;
        enemy.health -= amount;
        enemy.hurtTimer = Math.max(enemy.hurtTimer, 0.2);
        enemy.hitFlash = 0.15;
        enemy.state = 'hurt';
        enemy.stateTime = 0;
        enemy.vx = dir * (90 + amount * 2.2) / Math.max(1, enemy.poise) * knockBoost;
        burst(enemy.x + enemy.w * 0.5, enemy.y + enemy.h * 0.4, color, 9, 34, 126);
        game.cameraShake = Math.max(game.cameraShake, amount >= 20 ? CONFIG.fx.heavyHitShake : CONFIG.fx.hitShake);
        registerHit(amount >= 20 ? 'HEAVY HIT' : 'HIT');
        if (enemy.health <= 0) {
          enemy.dead = true;
          enemy.state = 'dead';
          enemy.stateTime = 0;
          enemy.deathTimer = enemy.type === 'heavy' ? 0.78 : 0.58;
          game.score += enemy.worth;
          game.player.scorePulse = CONFIG.player.scorePulse;
          burst(enemy.x + enemy.w * 0.5, enemy.y + enemy.h * 0.45, enemy.color, enemy.type === 'heavy' ? 18 : 12, 50, 190, 2, 5);
          audio.sfx('death');
        }
      }

      function applyPlayerHit(damage, sourceX, sourceType = 'melee') {
        const p = game.player;
        if (!p.alive || p.invuln > 0) return;
        if (p.parryTimer > 0) {
          triggerParrySuccess(sourceX);
          for (const enemy of game.enemies) {
            if (enemy.dead) continue;
            const close = Math.abs((enemy.x + enemy.w * 0.5) - (p.x + p.w * 0.5)) < 72;
            if (close && canParryAttack(enemy)) {
              enemy.stunTimer = enemy.type === 'heavy' ? CONFIG.enemyBalance.heavyParryStun : CONFIG.enemyBalance.defaultParryStun;
              enemy.attackTimer = 0;
              enemy.attackPhase = 'ready';
              enemy.attackCooldown = enemy.type === 'agile' ? CONFIG.enemyBalance.agileParryCooldown : CONFIG.enemyBalance.defaultParryCooldown;
              enemy.state = 'hurt';
              enemy.stateTime = 0;
              enemy.vx = sign((enemy.x + enemy.w * 0.5) - (p.x + p.w * 0.5)) * 140;
              burst(enemy.x + enemy.w * 0.5, enemy.y + enemy.h * 0.42, palette.white, 10, 30, 130, 1, 3);
            }
          }
          return;
        }

        p.health = Math.max(0, p.health - damage);
        p.parryFailTimer = 0;
        p.hurtTimer = CONFIG.player.hurtTimer;
        p.hitFlash = CONFIG.player.hurtFlash;
        p.invuln = sourceType === 'projectile' ? CONFIG.player.projectileInvuln : CONFIG.player.meleeInvuln;
        p.vx = sourceX < p.x ? CONFIG.player.knockbackX : -CONFIG.player.knockbackX;
        p.vy = CONFIG.player.knockbackY;
        setPlayerState('hurt');
        game.comboCount = 0;
        game.comboDecay = 0;
        game.comboText = '';
        burst(p.x + p.w * 0.5, p.y + 24, palette.red, 10, 40, 140);
        game.cameraShake = Math.max(game.cameraShake, CONFIG.fx.playerHitShake);
        audio.sfx('hurt');
        haptic(CONFIG.haptics.hitMs);

        if (p.health <= 0) {
          p.alive = false;
          setPlayerState('dead');
          p.deathTimer = CONFIG.player.deathTimer;
          game.gameOver = true;
          game.restartTimer = CONFIG.ui.overlayReadyDelay;
          burst(p.x + p.w * 0.5, p.y + 30, palette.gold, 12, 50, 160);
          haptic(CONFIG.haptics.deathMs);
        }
      }

      function updatePlayer(dt) {
        const p = game.player;
        validatePlayerCombatState();
        p.stateTime = Math.max(CONFIG.animation.stateClampFloor, p.stateTime + dt);
        p.animationTime += dt;
        p.hitFlash = Math.max(0, p.hitFlash - dt);
        p.hurtTimer = Math.max(0, p.hurtTimer - dt);
        p.invuln = Math.max(0, p.invuln - dt);
        p.parryTimer = Math.max(0, p.parryTimer - dt);
        p.parryCooldown = Math.max(0, p.parryCooldown - dt);
        p.parrySuccess = Math.max(0, p.parrySuccess - dt);
        p.parryGlow = Math.max(0, p.parryGlow - dt);
        p.parryFailTimer = Math.max(0, p.parryFailTimer - dt);
        p.counterWindow = Math.max(0, p.counterWindow - dt);
        p.scorePulse = Math.max(0, p.scorePulse - dt);
        p.attackCooldowns.punch = Math.max(0, p.attackCooldowns.punch - dt);
        p.attackCooldowns.kick = Math.max(0, p.attackCooldowns.kick - dt);
        const movingAnim = Math.abs(p.vx) > CONFIG.player.moveSpeedThreshold && p.onGround;
        p.walkCycle += dt * (movingAnim ? CONFIG.animation.walkRateMoving : CONFIG.animation.walkRateIdle);
        p.bobPhase += dt * (movingAnim ? CONFIG.animation.bobRateMoving : CONFIG.animation.bobRateIdle);

        if (!p.alive) {
          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.y + p.h >= GROUND_Y) {
            p.y = GROUND_Y - p.h;
            p.vy = 0;
          }
          return;
        }

        const axis = axisInput();
        const moveFactor = p.attack
          ? CONFIG.player.attackMoveFactor[p.attack.type] || 0.4
          : (p.parryTimer > 0 ? CONFIG.player.parryMoveFactor : 1);
        const desired = axis * p.speed * moveFactor;
        const accel = p.onGround ? CONFIG.player.moveAccelGround : CONFIG.player.moveAccelAir;
        p.vx = approach(p.vx, desired, accel * dt);

        if (axis !== 0) p.dir = axis > 0 ? 1 : -1;

        const jumpNow = pressJump();
        if (jumpNow && !p.jumpLatch && p.onGround && (!CONFIG.player.jumpLockAttack || !p.attack)) {
          p.vy = -p.jumpPower;
          p.onGround = false;
        }
        p.jumpLatch = jumpNow;

        const parryNow = pressParry();
        if (parryNow && !p.parryLatch) tryParry();
        p.parryLatch = parryNow;

        const punchNow = pressPunch();
        if (punchNow && !p.attackLatch.punch) startAttack('punch');
        p.attackLatch.punch = punchNow;

        const kickNow = pressKick();
        if (kickNow && !p.attackLatch.kick) startAttack('kick');
        p.attackLatch.kick = kickNow;

        if (p.attack) {
          const a = p.attack;
          a.timer -= dt;
          const elapsed = a.duration - Math.max(a.timer, 0);
          if (!a.hitDone && elapsed >= a.windup && elapsed <= a.activeEnd) {
            const hb = getAttackHitbox();
            let hitAnything = false;
            for (const enemy of game.enemies) {
              if (enemy.dead || enemy.hurtTimer > 0.06) continue;
              if (rectsOverlap(hb, enemy)) {
                let dmg = a.damage;
                if (p.counterWindow > 0) dmg += a.counterBonus;
                damageEnemy(enemy, dmg, p.dir, a.color, a.type === 'kick' ? 1.2 : 1);
                hitAnything = true;
              }
            }
            if (hitAnything) {
              a.hitDone = true;
              burst(hb.x + (p.dir > 0 ? hb.w : 0), hb.y + hb.h * 0.5, a.color, a.burstCount, 30, 140);
              if (p.counterWindow > 0) {
                flash(palette.green, CONFIG.fx.flashCounter.alpha, CONFIG.fx.flashCounter.life);
                p.counterWindow = 0;
              }
            }
          }
          if (a.timer < -CONFIG.animation.attackGraceTime) p.attack = null;
        }

        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        if (p.y + p.h >= GROUND_Y) {
          p.y = GROUND_Y - p.h;
          p.vy = 0;
          p.onGround = true;
        } else {
          p.onGround = false;
        }

        p.x = clamp(p.x, CONFIG.world.playerMinX, W - p.w - CONFIG.world.playerMaxXPadding);

        if (!p.onGround) setPlayerState(p.vy < 0 ? 'jump' : 'fall');
        else if (p.hurtTimer > 0) setPlayerState('hurt');
        else if (p.parryTimer > 0 || p.parrySuccess > 0) setPlayerState('parry');
        else if (p.attack) setPlayerState(p.attack.type === 'kick' ? 'kick' : 'punch');
        else if (Math.abs(p.vx) > CONFIG.player.moveStateThreshold) setPlayerState('walk');
        else setPlayerState('idle');
      }

      function meleeEnemyHitbox(enemy) {
        return {
          x: enemy.dir > 0 ? enemy.x + enemy.w - CONFIG.enemyBalance.meleeStrikeHitbox.forwardInset : enemy.x + CONFIG.enemyBalance.meleeStrikeHitbox.offsetNear,
          y: enemy.y + CONFIG.enemyBalance.meleeStrikeHitbox.y,
          w: enemy.type === 'heavy' ? CONFIG.enemyBalance.meleeStrikeHitbox.heavyW : CONFIG.enemyBalance.meleeStrikeHitbox.defaultW,
          h: enemy.type === 'agile' ? CONFIG.enemyBalance.meleeStrikeHitbox.agileH : CONFIG.enemyBalance.meleeStrikeHitbox.defaultH
        };
      }

      function spawnProjectile(enemy) {
        const px = enemy.dir > 0 ? enemy.x + enemy.w + 2 : enemy.x - 8;
        const py = enemy.y + 24;
        game.projectiles.push({
          x: px,
          y: py,
          w: 10,
          h: 10,
          vx: enemy.dir * CONFIG.enemyBalance.projectileSpeed,
          vy: CONFIG.enemyBalance.projectileLift,
          spin: rand(-10, 10),
          rot: 0,
          life: CONFIG.enemyBalance.projectileLife,
          color: palette.green,
          dead: false
        });
        burst(px, py, palette.green, 6, 20, 90, 2, 3);
        audio.sfx('throw');
      }

      function updateEnemies(dt) {
        const p = game.player;
        for (let i = game.enemies.length - 1; i >= 0; i--) {
          const e = game.enemies[i];
          e.stateTime = Math.max(0, e.stateTime + dt);
          e.animationTime += dt;
          e.walkCycle += dt * CONFIG.animation.enemyWalkRate;
          e.hitFlash = Math.max(0, e.hitFlash - dt);
          e.hurtTimer = Math.max(0, e.hurtTimer - dt);
          e.stunTimer = Math.max(0, e.stunTimer - dt);
          e.dodgeTimer = Math.max(0, e.dodgeTimer - dt);
          e.attackCooldown = Math.max(0, e.attackCooldown - dt);
          e.shootCooldown = Math.max(0, e.shootCooldown - dt);

          if (e.dead) {
            e.vx *= CONFIG.enemyBalance.hurtFriction;
            e.x += e.vx * dt;
            e.deathTimer -= dt;
            if (e.deathTimer <= 0) game.enemies.splice(i, 1);
            continue;
          }

          const pCenter = p.x + p.w * 0.5;
          const eCenter = e.x + e.w * 0.5;
          const dist = pCenter - eCenter;
          e.dir = dist >= 0 ? 1 : -1;
          e.lastKnownPlayerX = pCenter;

          if (e.stunTimer > 0) {
            e.state = 'hurt';
            e.vx = approach(e.vx, 0, CONFIG.enemyBalance.stunRecoverAccel * dt);
            e.x += e.vx * dt;
            continue;
          }

          if (e.hurtTimer > 0) {
            e.x += e.vx * dt;
            continue;
          }

          if (e.dodgeTimer > 0) {
            e.state = 'walk';
            e.x += e.vx * dt;
            continue;
          }

          const absDist = Math.abs(dist);
          const desiredRange = e.projectile ? e.attackRange : e.attackRange + CONFIG.enemyBalance.meleeExtraRange;

          if (e.projectile) {
            if (absDist > desiredRange + CONFIG.enemyBalance.rangedIdealPaddingFar) {
              e.vx = e.dir * e.baseSpeed;
              e.state = 'walk';
            } else if (absDist < desiredRange - CONFIG.enemyBalance.rangedIdealPaddingNear) {
              e.vx = -e.dir * e.baseSpeed * 0.85;
              e.state = 'walk';
            } else {
              e.vx = approach(e.vx, 0, CONFIG.enemyBalance.meleeApproachDecel * dt);
              if (e.attackCooldown <= 0 && p.alive) {
                e.attackPhase = 'windup';
                e.attackTimer += dt;
                e.state = 'attack';
                if (e.attackTimer >= e.attackWindup) {
                  e.attackTimer = 0;
                  e.attackPhase = 'release';
                  spawnProjectile(e);
                  e.attackCooldown = CONFIG.enemyBalance.rangedShootCooldown;
                  e.attackPhase = 'ready';
                }
              } else {
                e.attackTimer = 0;
                e.attackPhase = 'ready';
                e.state = 'idle';
              }
            }
          } else if (absDist > desiredRange && p.alive) {
            e.vx = e.dir * e.baseSpeed;
            e.state = 'walk';
            e.attackTimer = 0;
            e.attackPhase = 'ready';
          } else {
            e.vx = approach(e.vx, 0, CONFIG.enemyBalance.meleeApproachDecel * dt);
            if (e.attackCooldown <= 0 && p.alive) {
              if (e.type === 'agile' && e.dodgeChance > 0 && chance(e.dodgeChance * dt * 60) && absDist < CONFIG.enemyBalance.agileDodgeDistance) {
                e.dodgeTimer = CONFIG.enemyBalance.agileDodgeDuration;
                e.vx = -e.dir * CONFIG.enemyBalance.agileDodgeSpeed;
                burst(e.x + e.w * 0.5, e.y + e.h * 0.6, palette.agile, 5, 20, 70, 2, 3);
              } else {
                e.attackPhase = 'windup';
                e.attackTimer += dt;
                e.state = 'attack';
                if (e.attackTimer >= e.attackWindup) {
                  e.attackPhase = 'strike';
                  const hb = meleeEnemyHitbox(e);
                  if (rectsOverlap(hb, p)) applyPlayerHit(e.damage, e.x, 'melee');
                  e.attackTimer = 0;
                  e.attackCooldown = enemyTemplate(e.type).cooldown;
                  e.attackPhase = 'ready';
                }
              }
            } else {
              e.attackTimer = 0;
              e.attackPhase = 'ready';
              e.state = 'idle';
            }
          }

          e.x += e.vx * dt;
          if (e.x < CONFIG.world.enemyCullX) game.enemies.splice(i, 1);
        }
      }

      function updateProjectiles(dt) {
        const p = game.player;
        for (let i = game.projectiles.length - 1; i >= 0; i--) {
          const pr = game.projectiles[i];
          pr.life -= dt;
          pr.x += pr.vx * dt;
          pr.y += pr.vy * dt;
          pr.rot += pr.spin * dt;
          pr.vy += CONFIG.enemyBalance.projectileGravity * dt;

          if (p.parryTimer > 0 && pr.color !== palette.gold) {
            const parryBox = { x: p.x - 10, y: p.y + 8, w: p.w + 20, h: p.h - 10 };
            if (rectsOverlap(pr, parryBox)) {
              pr.vx *= CONFIG.enemyBalance.projectileParrySpeedScale * 1.15;
              pr.vy = CONFIG.enemyBalance.projectileParryLift - 10;
              pr.spin *= -1.8;
              pr.color = palette.gold;
              triggerParrySuccess(pr.x + 4, { projectile: true, counterWindow: CONFIG.enemyBalance.projectileParryCounterWindow });
              flash(palette.white, CONFIG.fx.flashProjectileParry.alpha, CONFIG.fx.flashProjectileParry.life);
              burst(pr.x + 4, pr.y + 4, palette.green, 18, 60, 200);
              for (const enemy of game.enemies) {
                if (enemy.dead) continue;
                const close = Math.abs((enemy.x + enemy.w * 0.5) - (p.x + p.w * 0.5)) < 84;
                if (close) enemy.stunTimer = Math.max(enemy.stunTimer, CONFIG.enemyBalance.projectileParryStun);
              }
            }
          }

          if (rectsOverlap(pr, p) && pr.vx * p.dir <= 0) {
            applyPlayerHit(CONFIG.enemyBalance.projectileDamage, pr.x, 'projectile');
            burst(pr.x + 4, pr.y + 4, pr.color, 8, 30, 110);
            game.projectiles.splice(i, 1);
            continue;
          }

          for (const enemy of game.enemies) {
            if (enemy.dead) continue;
            if (pr.color === palette.gold && rectsOverlap(pr, enemy)) {
              damageEnemy(enemy, CONFIG.enemyBalance.projectileParryDamage, sign(pr.vx), palette.gold, CONFIG.enemyBalance.projectileParryKnockBoost);
              burst(pr.x + 4, pr.y + 4, palette.gold, 8, 30, 110);
              game.projectiles.splice(i, 1);
              break;
            }
          }
          if (!game.projectiles[i]) continue;

          if (pr.life <= 0 || pr.x < -CONFIG.world.projectileCullMargin || pr.x > W + CONFIG.world.projectileCullMargin || pr.y > H + 20) {
            game.projectiles.splice(i, 1);
          }
        }
      }

      function updateParticles(dt) {
        const active = game.particlePool.active;
        for (let i = active.length - 1; i >= 0; i--) {
          const p = active[i];
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += p.gravity * dt;
          p.vx *= CONFIG.fx.particleFriction;
          const lifeRatio = p.maxLife > 0 ? clamp(p.life / p.maxLife, 0, 1) : 0;
          p.alphaBucket = Math.max(0.25, Math.ceil(lifeRatio * 4) / 4);
          if (p.life <= 0) recycleParticle(i);
        }
        for (let i = game.flashes.length - 1; i >= 0; i--) {
          const f = game.flashes[i];
          f.life -= dt;
          if (f.life <= 0) game.flashes.splice(i, 1);
        }
      }

      function getSpawnCap(score) {
        for (const row of CONFIG.spawn.maxAliveByScore) {
          if (score > row.score) return row.cap;
        }
        return 5;
      }

      function updateSpawner(dt) {
        if (game.gameOver) return;
        game.spawnInterval = Math.max(CONFIG.spawn.minInterval, CONFIG.spawn.intervalBase - game.time * CONFIG.spawn.difficultyRamp);
        game.spawnTimer -= dt;
        if (game.spawnTimer <= 0) {
          let aliveCount = 0;
          for (const enemy of game.enemies) if (!enemy.dead) aliveCount++;
          const cap = getSpawnCap(game.score);
          if (aliveCount < cap) game.enemies.push(spawnEnemy(game.score));
          game.spawnTimer = game.spawnInterval * rand(CONFIG.spawn.jitterMin, CONFIG.spawn.jitterMax);
        }
      }

      function update(dt) {
        const scaledDt = dt * game.timeScale;
        game.time += scaledDt;
        game.cameraShake = Math.max(0, game.cameraShake - scaledDt * CONFIG.fx.cameraShakeDecay);
        game.comboTimer = Math.max(0, game.comboTimer - scaledDt);
        if (game.comboDecay > 0) {
          game.comboDecay -= scaledDt;
          if (game.comboDecay <= 0) game.comboCount = 0;
        }
        if (game.gameOver) game.restartTimer = Math.max(0, game.restartTimer - scaledDt);

        if (game.freezeTimer > 0) {
          game.freezeTimer = Math.max(0, game.freezeTimer - dt);
          updateParticles(dt * 0.35);
          return;
        }
        if (game.timeScaleTimer > 0) {
          game.timeScaleTimer = Math.max(0, game.timeScaleTimer - dt);
          if (game.timeScaleTimer <= 0) game.timeScale = 1;
        } else if (game.timeScale < 1) {
          game.timeScale = approach(game.timeScale, 1, dt * 5.5);
        }

        updatePlayer(scaledDt);
        updateSpawner(scaledDt);
        updateEnemies(scaledDt);
        updateProjectiles(scaledDt);
        updateParticles(scaledDt);
      }

      function drawBackground(t) {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, palette.skyTop);
        sky.addColorStop(1, palette.skyBottom);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(233,243,255,0.95)';
        ctx.beginPath();
        ctx.arc(286, 84, 22, 0, Math.PI * 2);
        ctx.fill();

        for (let i = 0; i < 22; i++) {
          ctx.fillStyle = i % 3 === 0 ? palette.cityA : i % 3 === 1 ? palette.cityB : palette.cityC;
          const bw = 14 + (i % 4) * 8;
          const bh = 90 + (i % 5) * 26 + (i % 2) * 16;
          const x = i * 18 - ((t * 10) % 18);
          ctx.fillRect(x, 220 - bh * 0.35, bw, bh);
          ctx.fillStyle = i % 2 ? 'rgba(255,215,90,0.12)' : 'rgba(99,216,255,0.15)';
          ctx.fillRect(x + 3, 220 - bh * 0.18, bw - 6, 3);
          ctx.fillRect(x + 5, 220 - bh * 0.1 + 10, bw - 10, 2);
        }

        for (let i = 0; i < 5; i++) {
          const lx = 42 + i * 64 - ((t * 16) % 6);
          const sway = Math.sin(t * CONFIG.animation.backgroundLanternSway + i) * 3;
          ctx.strokeStyle = 'rgba(255,233,164,0.32)';
          ctx.beginPath();
          ctx.moveTo(lx, 70);
          ctx.lineTo(lx + sway, 112);
          ctx.stroke();
          ctx.fillStyle = 'rgba(255,215,90,0.85)';
          ctx.fillRect(lx - 6 + sway, 112, 12, 16);
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          ctx.fillRect(lx - 3 + sway, 115, 6, 6);
        }

        ctx.fillStyle = '#0a0d17';
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
        for (let y = GROUND_Y; y < H; y += 18) {
          ctx.fillStyle = y % 36 === 0 ? palette.groundB : palette.groundA;
          ctx.fillRect(0, y, W, 18);
        }
        ctx.strokeStyle = palette.floorLine;
        ctx.lineWidth = 1;
        for (let x = -50; x < W + 70; x += 28) {
          const shift = (t * 90) % 28;
          ctx.beginPath();
          ctx.moveTo(x - shift, GROUND_Y);
          ctx.lineTo(x + 36 - shift, H);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(99,216,255,0.2)';
        ctx.fillRect(0, GROUND_Y - 4, W, 4);
      }

      function drawShadow(x, y, w, alpha = 0.22) {
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.beginPath();
        ctx.ellipse(x, y, w, w * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawFighter(entity, isPlayer) {
        const x = Math.round(entity.x);
        const y = Math.round(entity.y);
        const dir = entity.dir || 1;
        const body = isPlayer ? palette.player : entity.color;
        const dark = isPlayer ? palette.playerDark : entity.dark;
        const trim = isPlayer ? palette.playerTrim : palette.white;
        const moving = Math.abs(entity.vx) > CONFIG.player.moveSpeedThreshold && !entity.dead;
        const walkPhase = isPlayer ? game.player.walkCycle : entity.walkCycle;
        const walk = Math.sin(walkPhase * 1.2);
        const idle = Math.sin((entity.animationTime + x * 0.02) * CONFIG.animation.bodyIdleBobRate) * 1.2;
        const bob = moving ? walk * 1.3 : idle;
        const punching = entity.state === 'punch' || (!isPlayer && entity.state === 'attack' && !entity.projectile);
        const kicking = entity.state === 'kick';
        const parrying = isPlayer && (entity.state === 'parry');
        const hurting = entity.state === 'hurt';
        const dying = entity.state === 'dead';
        const frontArmExt = punching ? 10 : 0;
        const frontLegExt = kicking ? 14 : 0;
        const torsoLean = punching ? 3 : kicking ? 5 : parrying ? -2 : moving ? clamp(entity.vx / 70, -3, 3) : 0;
        const flashActive = entity.hitFlash > 0 || (isPlayer && entity.parrySuccess > 0);

        drawShadow(x + entity.w * 0.5, GROUND_Y + 3, entity.w * (isPlayer ? 0.56 : 0.52), dying ? 0.12 : 0.22);

        ctx.save();
        ctx.translate(x + entity.w * 0.5, y + entity.h * 0.5 + bob);
        ctx.scale(dir, dying ? 0.92 : 1);
        if (dying) ctx.rotate(-0.75);
        ctx.translate(-(x + entity.w * 0.5), -(y + entity.h * 0.5));

        if (flashActive) {
          ctx.globalAlpha = isPlayer && entity.parrySuccess > 0 ? 0.45 : 0.34;
          ctx.fillStyle = entity.parrySuccess > 0 ? palette.green : palette.white;
          ctx.fillRect(x - 4, y - 4, entity.w + 8, entity.h + 8);
          ctx.globalAlpha = 1;
        }

        if (hurting) ctx.translate(-dir * 2, 0);

        const hipY = y + 44;
        const shoulderY = y + 20;

        ctx.fillStyle = dark;
        ctx.fillRect(x + 11 + torsoLean * 0.5, y + 14, 16, 30);
        ctx.fillStyle = body;
        ctx.fillRect(x + 9 + torsoLean * 0.7, y + 10, 18, 34);

        ctx.fillStyle = dark;
        ctx.fillRect(x + 8, shoulderY, 6, 17);
        ctx.fillRect(x + 24, shoulderY + 2, 7 + frontArmExt, 8);
        ctx.fillStyle = body;
        ctx.fillRect(x + 8, shoulderY, 5, 16);
        ctx.fillRect(x + 24, shoulderY + 2, 6 + frontArmExt, 7);

        if (parrying) {
          ctx.fillStyle = palette.green;
          ctx.fillRect(x + 26, shoulderY - 2, 8, 10);
        }

        const backLegShift = moving ? walk * 3 : 0;
        const frontLegShift = moving ? -walk * 3 : 0;
        ctx.fillStyle = dark;
        ctx.fillRect(x + 12, hipY + backLegShift, 6, 22);
        ctx.fillRect(x + 20 + frontLegExt * 0.5, hipY + frontLegShift, 6 + frontLegExt, 22);
        ctx.fillStyle = body;
        ctx.fillRect(x + 11, hipY + backLegShift, 6, 21);
        ctx.fillRect(x + 20 + frontLegExt * 0.5, hipY + frontLegShift, 5 + frontLegExt, 20);

        ctx.fillStyle = dark;
        ctx.fillRect(x + 9, y + 2, 20, 17);
        ctx.fillStyle = hurting ? '#ffd4d9' : trim;
        ctx.fillRect(x + 10, y + 3, 18, 15);
        ctx.fillStyle = palette.black;
        ctx.fillRect(x + 18, y + 8, 5, 3);
        ctx.fillRect(x + 24, y + 8, 2, 3);
        ctx.fillRect(x + 19, y + 13, kicking ? 6 : 5, 2);

        if (!isPlayer) {
          ctx.fillStyle = entity.type === 'agile' ? palette.cyan : entity.type === 'heavy' ? palette.purple : entity.type === 'ranged' ? palette.green : palette.gold;
          ctx.fillRect(x + 9, y + 0, 20, 2);
          if (entity.projectile) {
            ctx.fillStyle = palette.green;
            ctx.fillRect(x + 2, y + 24, 5, 5);
          }
        }

        ctx.restore();
      }

      function drawProjectiles() {
        for (const pr of game.projectiles) {
          ctx.save();
          ctx.translate(pr.x + pr.w * 0.5, pr.y + pr.h * 0.5);
          ctx.rotate(pr.rot);
          ctx.fillStyle = pr.color;
          ctx.fillRect(-5, -5, 10, 10);
          ctx.fillStyle = 'rgba(255,255,255,0.65)';
          ctx.fillRect(-2, -2, 4, 4);
          ctx.restore();
        }
      }

      function drawParticles() {
        const active = game.particlePool.active;
        if (!active.length) return;
        const batches = new Map();
        for (const p of active) {
          const alpha = p.alphaBucket;
          const key = `${p.color}|${alpha}`;
          let batch = batches.get(key);
          if (!batch) {
            batch = { color: p.color, alpha, items: [] };
            batches.set(key, batch);
          }
          batch.items.push(p);
        }
        for (const batch of batches.values()) {
          ctx.globalAlpha = batch.alpha;
          ctx.fillStyle = batch.color;
          for (const p of batch.items) {
            ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawUI() {
        const p = game.player;
        ctx.fillStyle = 'rgba(6,8,14,0.65)';
        ctx.fillRect(12, 12, 206, 38);
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.strokeRect(12.5, 12.5, 205, 37);

        const hp = p.health / p.maxHealth;
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.fillRect(20, 21, 132, 18);
        const hpGrad = ctx.createLinearGradient(20, 0, 152, 0);
        hpGrad.addColorStop(0, '#ff5d73');
        hpGrad.addColorStop(1, hp < 0.35 ? '#ffb457' : '#ffd75a');
        ctx.fillStyle = hpGrad;
        ctx.fillRect(20, 21, Math.max(0, 132 * hp), 18);
        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.strokeRect(20.5, 21.5, 131, 17);

        ctx.fillStyle = palette.white;
        ctx.font = 'bold 11px Arial';
        ctx.fillText(`HP ${p.health}/${p.maxHealth}`, 160, 34);

        ctx.textAlign = 'right';
        ctx.fillStyle = p.scorePulse > 0 ? palette.gold : palette.white;
        ctx.font = 'bold 18px Arial';
        ctx.fillText(String(game.score).padStart(4, '0'), W - 16, 28);
        ctx.font = 'bold 11px Arial';
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillText('街头积分', W - 16, 42);
        ctx.textAlign = 'left';

        if (p.counterWindow > 0) {
          ctx.fillStyle = 'rgba(125,255,176,0.16)';
          ctx.fillRect(12, 56, CONFIG.ui.counterMeterW, 18);
          ctx.strokeStyle = 'rgba(125,255,176,0.32)';
          ctx.strokeRect(12.5, 56.5, CONFIG.ui.counterMeterW - 1, 17);
          ctx.fillStyle = palette.green;
          ctx.font = 'bold 11px Arial';
          ctx.fillText('COUNTER OPEN', 20, 69);
        } else {
          const ready = p.parryCooldown <= 0;
          const ratio = ready ? 1 : (1 - p.parryCooldown / CONFIG.player.parryCooldown);
          const pulse = ready ? 0.7 + 0.3 * Math.sin(game.time * CONFIG.player.parryPulseRate) : 0.4 + 0.25 * Math.sin(game.time * CONFIG.player.parryCooldownBlinkRate);
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(12, 56, CONFIG.ui.parryMeterW, 16);
          ctx.fillStyle = ready ? `rgba(125,255,176,${0.45 + pulse * 0.35})` : 'rgba(125,255,176,0.8)';
          ctx.fillRect(12, 56, CONFIG.ui.parryMeterW * clamp(ratio, 0, 1), 16);
          ctx.strokeStyle = ready ? 'rgba(125,255,176,0.65)' : 'rgba(255,255,255,0.14)';
          ctx.strokeRect(12.5, 56.5, CONFIG.ui.parryMeterW - 1, 15);
          ctx.fillStyle = ready ? palette.green : 'rgba(255,255,255,0.75)';
          ctx.font = 'bold 11px Arial';
          ctx.fillText(ready ? 'PARRY READY' : 'PARRY RECHARGE', 20, 69);
        }

        if (p.parrySuccess > 0) {
          ctx.save();
          ctx.globalAlpha = clamp(p.parrySuccess / CONFIG.player.parrySuccessTime, 0, 1);
          ctx.fillStyle = palette.white;
          ctx.font = 'bold 28px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('PARRY!', W / 2, 190);
          ctx.fillStyle = palette.green;
          ctx.font = 'bold 14px Arial';
          ctx.fillText('PERFECT TIMING', W / 2, 212);
          ctx.restore();
          ctx.textAlign = 'left';
        } else if (p.parryFailTimer > 0) {
          ctx.save();
          ctx.globalAlpha = clamp(p.parryFailTimer / 0.18, 0, 1);
          ctx.fillStyle = '#ff9aa9';
          ctx.font = 'bold 18px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('TOO EARLY', W / 2, 192);
          ctx.restore();
          ctx.textAlign = 'left';
        }

        if (game.comboTimer > 0 && game.comboText) {
          ctx.globalAlpha = clamp(game.comboTimer / CONFIG.ui.comboFade, 0, 1);
          ctx.fillStyle = palette.gold;
          ctx.font = 'bold 16px Arial';
          ctx.fillText(game.comboText, 20, CONFIG.ui.hudY.combo);
          ctx.globalAlpha = 1;
        }

        ctx.fillStyle = 'rgba(255,255,255,0.68)';
        ctx.font = '10px Arial';
        ctx.fillText('Punch J', 16, H - 126);
        ctx.fillText('Kick K', 16, H - 112);
        ctx.fillText('Parry P', 16, H - 98);
      }

      function drawControls() {
        const p = game.player;
        for (const control of controlList) {
          const active = touchState[control.key] ||
            (control.key === 'left' && pressLeft()) ||
            (control.key === 'right' && pressRight()) ||
            (control.key === 'jump' && pressJump()) ||
            (control.key === 'punch' && pressPunch()) ||
            (control.key === 'kick' && pressKick()) ||
            (control.key === 'parry' && pressParry()) ||
            (control.key === 'mute' && !game.muted && game.musicStarted);

          let fill = active ? 'rgba(255,255,255,0.22)' : control.color;
          let stroke = active ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.18)';
          let scale = 1;
          if (control.key === 'parry') {
            if (p.parryTimer > 0) {
              fill = `rgba(125,255,176,${0.38 + 0.3 * Math.sin(game.time * CONFIG.player.parryPulseRate)})`;
              stroke = 'rgba(255,255,255,0.96)';
              scale = 1.14;
            } else if (p.parryCooldown <= 0) {
              fill = `rgba(125,255,176,${0.2 + 0.14 * (0.5 + 0.5 * Math.sin(game.time * 6))})`;
              stroke = 'rgba(125,255,176,0.72)';
              scale = 1.05;
            } else {
              fill = 'rgba(80,110,92,0.16)';
              stroke = 'rgba(255,255,255,0.12)';
            }
          }
          ctx.globalAlpha = control.key === 'mute' ? 0.95 : 0.9;
          ctx.fillStyle = fill;
          ctx.save();
          ctx.translate(control.x, control.y);
          ctx.scale(scale, scale);
          ctx.beginPath();
          ctx.arc(0, 0, control.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = stroke;
          ctx.lineWidth = control.key === 'kick' ? 2.4 : 2;
          ctx.stroke();
          if (control.key === 'parry' && p.parryTimer > 0) {
            ctx.strokeStyle = 'rgba(255,255,255,0.38)';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.arc(0, 0, control.r + 6 + Math.sin(game.time * 18) * 2, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.fillStyle = control.key === 'kick' ? palette.red : control.key === 'parry' ? palette.green : control.key === 'jump' ? palette.cyan : palette.white;
          if (control.key === 'mute' && game.muted) ctx.fillStyle = 'rgba(255,255,255,0.46)';
          ctx.font = control.key === 'mute' ? 'bold 14px Arial' : 'bold 15px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(control.key === 'mute' && game.muted ? '×' : control.label, 0, 1);
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
      }

      function reportRuntimeError(label, err) {
        const message = err instanceof Error ? err.message : String(err || 'Unknown error');
        console.error(label, err);
        game.runtimeError = `${label}: ${message}`;
      }

      function safeRender() {
        try {
          render();
        } catch (err) {
          reportRuntimeError('Render failure', err);
        }
      }

      function safeUpdate(dt) {
        try {
          update(dt);
        } catch (err) {
          reportRuntimeError('Game loop failure', err);
          game.accumulatorMs = 0;
        }
      }

      function drawOverlay() {
        for (const f of game.flashes) {
          ctx.globalAlpha = f.alpha * (f.life / f.maxLife);
          ctx.fillStyle = f.color;
          ctx.fillRect(0, 0, W, H);
        }
        ctx.globalAlpha = 1;

        if (game.runtimeError) {
          ctx.fillStyle = 'rgba(5,7,12,0.82)';
          ctx.fillRect(0, 0, W, H);
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ff8f9f';
          ctx.font = 'bold 22px Arial';
          ctx.fillText('SYSTEM STUNNED', W / 2, 236);
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.font = '13px Arial';
          ctx.fillText('A runtime error occurred. Reload to recover.', W / 2, 270);
          ctx.fillStyle = 'rgba(255,255,255,0.72)';
          ctx.font = '11px Arial';
          ctx.fillText(game.runtimeError.slice(0, 64), W / 2, 296);
          ctx.textAlign = 'left';
          return;
        }

        if (!game.gameOver) return;
        ctx.fillStyle = 'rgba(5,7,12,0.58)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = palette.white;
        ctx.font = 'bold 28px Arial';
        ctx.fillText('DRAGON DOWN', W / 2, 248);
        ctx.fillStyle = palette.gold;
        ctx.font = 'bold 16px Arial';
        ctx.fillText(`Score ${game.score}`, W / 2, 282);
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.font = '14px Arial';
        const ready = game.restartTimer <= 0;
        ctx.fillText(ready ? 'Tap any attack or press Enter to restart' : '...', W / 2, 316);
        ctx.fillStyle = 'rgba(255,255,255,0.66)';
        ctx.font = '12px Arial';
        ctx.fillText('Parry just before impact to stun and counter.', W / 2, 342);
        ctx.textAlign = 'left';
      }

      function render() {
        ctx.save();
        try {
          if (game.cameraShake > 0) ctx.translate(rand(-game.cameraShake, game.cameraShake), rand(-game.cameraShake, game.cameraShake));

          drawBackground(game.time);

          const ordered = [game.player, ...game.enemies].sort((a, b) => (a.y + a.h) - (b.y + b.h));
          for (const entity of ordered) drawFighter(entity, entity === game.player);

          const hb = getAttackHitbox();
          if (hb && game.player.attack) {
            ctx.fillStyle = game.player.attack.type === 'kick' ? CONFIG.fx.flashHitboxKick : CONFIG.fx.flashHitboxPunch;
            ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
          }

          if (game.player.parryTimer > 0 || game.player.parryGlow > 0) {
            const glowAlpha = game.player.parryTimer > 0
              ? 0.7 + 0.3 * Math.sin(game.time * CONFIG.player.parryPulseRate)
              : 0.22 + clamp(game.player.parryGlow / 0.38, 0, 1) * 0.38;
            ctx.save();
            ctx.strokeStyle = `rgba(125,255,176,${glowAlpha})`;
            ctx.lineWidth = game.player.parryTimer > 0 ? 2.4 : 1.6;
            ctx.strokeRect(game.player.x - 4, game.player.y + 10, game.player.w + 8, game.player.h - 16);
            ctx.strokeStyle = `rgba(255,255,255,${glowAlpha * 0.6})`;
            ctx.strokeRect(game.player.x - 9, game.player.y + 5, game.player.w + 18, game.player.h - 6);
            ctx.restore();
          }

          drawProjectiles();
          drawParticles();
          drawUI();
          drawControls();
          drawOverlay();
        } finally {
          ctx.restore();
        }
      }

      function loop(ts) {
        if (!game.lastTs) {
          game.lastTs = ts;
          safeRender();
          requestAnimationFrame(loop);
          return;
        }
        const frameDeltaMs = Math.min(ts - game.lastTs, MAX_FRAME_DELTA_MS);
        game.lastTs = ts;
        game.accumulatorMs += frameDeltaMs;

        let steps = 0;
        while (game.accumulatorMs >= FRAME_MS && steps < MAX_UPDATE_STEPS && !game.runtimeError) {
          safeUpdate(FIXED_DT);
          game.accumulatorMs -= FRAME_MS;
          steps++;
        }
        if (steps === MAX_UPDATE_STEPS) game.accumulatorMs = 0;

        safeRender();
        requestAnimationFrame(loop);
      }

      function controlAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = (clientX - rect.left) * (W / rect.width);
        const y = (clientY - rect.top) * (H / rect.height);
        for (const control of controlList) {
          const dx = x - control.x;
          const dy = y - control.y;
          if (dx * dx + dy * dy <= control.hitR * control.hitR) return control.key;
        }
        if (game.gameOver && game.restartTimer <= 0) return 'restart';
        return null;
      }

      function releasePointer(id) {
        const existing = pointers.get(id);
        if (existing && touchState[existing]) touchState[existing] = false;
        pointers.delete(id);
      }

      async function primeAudio(source = 'interaction') {
        console.log(`[KungFuBrawler audio] primeAudio from ${source}`);
        if (!game.musicStarted) setAudioBadge(`${audioBadgeText('starting')} · ${source}`, 'starting');
        else if (!game.audioUnlocked) setAudioBadge(`${audioBadgeText('resuming')} · ${source}`, 'starting');
        try {
          const started = await audio.start();
          if (!started) {
            if (!game.audioError) game.audioError = 'Audio not running';
            setAudioBadge(`${audioBadgeText(audio.ctx?.state || 'locked')} · tap/click/key`, game.audioError ? 'error' : 'locked');
            return false;
          }
          if (game.muted) {
            game.muted = false;
            audio.setMuted(false);
          }
          game.audioError = '';
          const stateLabel = audio.ctx?.state || 'running';
          setAudioBadge(`${audioBadgeText(stateLabel)} · music on`, 'live', CONFIG.audio.badgeLiveHideMs);
          console.log('[KungFuBrawler audio] audio started successfully', { source, state: stateLabel });
          return true;
        } catch (err) {
          game.audioError = err?.message || 'Audio start failed';
          setAudioBadge(`${audioBadgeText('error')} · ${game.audioError}`, 'error');
          console.error('[KungFuBrawler audio] Audio start failed', err);
          return false;
        }
      }

      function toggleMute(forceMuted = null) {
        game.muted = typeof forceMuted === 'boolean' ? forceMuted : !game.muted;
        audio.setMuted(game.muted);
        game.audioError = '';
        const stateLabel = audio.ctx?.state || (game.musicStarted ? 'running' : 'locked');
        setAudioBadge(game.muted ? `${audioBadgeText(stateLabel)} · muted` : `${audioBadgeText(stateLabel)} · music on`, game.muted ? 'locked' : 'live', game.musicStarted && !game.muted ? 1200 : 0);
      }

      function onPointerDown(e) {
        e.preventDefault();
        canvas.setPointerCapture?.(e.pointerId);
        primeAudio('pointer');
        const key = controlAt(e.clientX, e.clientY);
        if (key === 'restart') {
          resetGame();
          return;
        }
        if (key === 'mute') {
          toggleMute();
          return;
        }
        if (!key) return;
        pointers.set(e.pointerId, key);
        touchState[key] = true;
        if (key === 'punch' || key === 'kick' || key === 'parry') haptic(key === 'kick' ? CONFIG.haptics.kickMs : key === 'parry' ? CONFIG.haptics.parryMs : CONFIG.haptics.attackMs);
      }

      function onPointerMove(e) {
        if (!pointers.has(e.pointerId)) return;
        e.preventDefault();
        const next = controlAt(e.clientX, e.clientY);
        const prev = pointers.get(e.pointerId);
        if (prev && touchState[prev]) touchState[prev] = false;
        if (next && next !== 'restart' && next !== 'mute') {
          pointers.set(e.pointerId, next);
          touchState[next] = true;
        } else {
          pointers.delete(e.pointerId);
        }
      }

      function onPointerUp(e) {
        e.preventDefault();
        releasePointer(e.pointerId);
      }

      window.addEventListener('keydown', async (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) || e.key === ' ') e.preventDefault();
        keys[e.code] = true;
        await primeAudio('keyboard');
        if (e.code === 'KeyM') toggleMute();
        if (e.code === 'Enter' && game.gameOver && game.restartTimer <= 0) resetGame();
      }, { passive: false });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && game.musicStarted) primeAudio('visibility');
      });

      window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
      });

      function refreshViewportLayout() {
        updateSafeArea();
        layoutControls();
      }

      window.addEventListener('resize', refreshViewportLayout);
      window.addEventListener('orientationchange', refreshViewportLayout);
      window.screen?.orientation?.addEventListener?.('change', refreshViewportLayout);

      canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
      canvas.addEventListener('pointermove', onPointerMove, { passive: false });
      canvas.addEventListener('pointerup', onPointerUp, { passive: false });
      canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      unmuteBtn?.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (game.muted) toggleMute(false);
        await primeAudio('unmute button');
      }, { passive: false });

      window.addEventListener('blur', () => {
        for (const key in keys) keys[key] = false;
        for (const key in touchState) touchState[key] = false;
        pointers.clear();
      });

      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
