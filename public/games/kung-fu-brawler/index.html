<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Kung Fu Brawler</title>
  <style>
    :root {
      --bg: #0d1020;
      --ink: #f5f6fb;
      --gold: #ffd75a;
      --cyan: #63d8ff;
      --red: #ff667f;
      --jade: #5dffb2;
      --shell-radius: 24px;
      --shell-shadow: 0 20px 60px rgba(0,0,0,0.45);
      --game-width: 360px;
      --game-height: 640px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #1d2954 0%, #0c1122 45%, #05070d 100%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    #shell {
      position: relative;
      width: min(var(--game-width), 100%, calc(100vh * 0.5625));
      aspect-ratio: 9 / 16;
      max-width: var(--game-width);
      max-height: var(--game-height);
      overflow: hidden;
      border-radius: var(--shell-radius);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shell-shadow);
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    #hint, #audioBadge {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.8);
      background: rgba(5,8,16,0.55);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 6px 10px;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 180ms ease, transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    #hint { bottom: 10px; }
    #audioBadge {
      top: 10px;
      opacity: 1;
      white-space: normal;
      text-align: center;
      line-height: 1.3;
      min-width: 180px;
      max-width: calc(100% - 84px);
    }
    #audioBadge.is-starting {
      background: rgba(99,216,255,0.14);
      border-color: rgba(99,216,255,0.35);
      color: #dff7ff;
      transform: translateX(-50%) scale(1.02);
    }
    #audioBadge.is-live {
      background: rgba(93,255,178,0.14);
      border-color: rgba(93,255,178,0.35);
      color: #eafff4;
    }
    #audioBadge.is-error {
      background: rgba(255,102,127,0.16);
      border-color: rgba(255,102,127,0.38);
      color: #ffe8ed;
    }
    #audioBadge.is-hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-6px);
    }

    #unmuteBtn {
      position: absolute;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 132px;
      padding: 9px 16px;
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 999px;
      background: rgba(255,215,90,0.18);
      color: #fff7d6;
      font: 700 12px/1 Arial, Helvetica, sans-serif;
      letter-spacing: 0.08em;
      cursor: pointer;
      z-index: 5;
      transition: opacity 180ms ease, transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }
    #unmuteBtn.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(-6px);
    }
    #unmuteBtn.is-error {
      background: rgba(255,102,127,0.22);
      border-color: rgba(255,102,127,0.44);
      color: #ffe8ed;
    }

    @media (max-width: 680px), (pointer: coarse) {
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="shell" aria-label="Kung Fu Brawler game container">
    <canvas id="game" width="360" height="640" aria-label="Kung Fu Brawler"></canvas>
    <div id="audioBadge">AUDIO: LOCKED · TAP / CLICK / PRESS KEY</div>
    <button id="unmuteBtn" type="button">UNMUTE</button>
    <div id="hint">Move: ← → / A D · Jump: ↑ / W / Space · Punch: J · Kick: K / X · Parry: P / Shift</div>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const badge = document.getElementById('audioBadge');
      const unmuteBtn = document.getElementById('unmuteBtn');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const W = 360;

      const CONFIG = {

          attacks: {

            },

            }
          }
        },
        enemyBalance: {

          projectileParryStun: 1.02,
          agileParryCooldown: 0.7,

          meleeStrikeHitbox: {

        },
        fx: {

          maxParticles: 420,
          flashParry: { alpha: 0.45, life: 0.12 },
          flashCounter: { alpha: 0.12, life: 0.06 },
          flashProjectileParry: { alpha: 0.34, life: 0.1 },
          flashParryFail: { alpha: 0.18, life: 0.07 },
          flashHitboxKick: 'rgba(255,102,127,0.14)',

        },
        ui: {
          overlayReadyDelay: 0.35,
          comboFade: 0.55,
          counterMeterW: 112,
          parryMeterW: 90,
          hudY: { combo: 96, controls: H - 126 }
        },
        animation: {
          walkRateMoving: 12,
          walkRateIdle: 4,
          bobRateMoving: 10,
          bobRateIdle: 3,
          backgroundLanternSway: 1.8,
          bodyIdleBobRate: 3.6,
          enemyWalkRate: 9,
          attackGraceTime: 0.05,
          stateClampFloor: 0,
          maxStateStep: 0.2
        },
        haptics: {
          attackMs: 14,

          deathMs: 36
        },
        audio: {
          masterGain: 0.42,
          musicGain: 0.44,
          sfxGain: 1,
          lookahead: 0.2,
          schedulerMs: 60,
          tempo: 132,
          stopTail: 0.02,
          kickTail: 0.1,
          badgeLiveHideMs: 1600
        },
        seeds: {
          default: 0xC0FFEE12
        }
      };

      const GROUND_Y = CONFIG.world.groundY;
      const palette = {
        skyTop: '#17295a',
        skyBottom: '#060915',
        lantern: '#ffd75a',
        moon: '#e9f3ff',
        cityA: '#111a34',
        cityB: '#1a2444',
        cityC: '#0b1121',
        groundA: '#191c30',
        groundB: '#242941',
        floorLine: 'rgba(128, 178, 255, 0.18)',
        player: '#ffd04f',
        playerDark: '#6d4914',
        playerTrim: '#fff1c2',
        normal: '#ff7078',
        agile: '#79f1ff',
        heavy: '#9c88ff',
        ranged: '#7eff94',
        elite: '#ff9b5e',
        white: '#f7fbff',
        black: '#06080c',
        red: '#ff5d73',
        gold: '#ffe178',
        cyan: '#67dbff',
        green: '#7dffb0',
        purple: '#b19bff',
        shadow: 'rgba(0,0,0,0.28)'
      };
      CONFIG.player.attacks.punch.color = palette.gold;
      CONFIG.player.attacks.kick.color = palette.red;

      const keys = Object.create(null);
      const pointers = new Map();
      const touchState = { left: false, right: false, jump: false, punch: false, kick: false, parry: false, mute: false };

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function sign(v) { return v < 0 ? -1 : 1; }
      function approach(current, target, delta) {
        if (current < target) return Math.min(target, current + delta);
        if (current > target) return Math.max(target, current - delta);
        return current;
      }
      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      class SeededRNG {
        constructor(seed) {
          this.setSeed(seed);
        }
        setSeed(seed) {
          this.seed = (seed >>> 0) || CONFIG.seeds.default;
        }
        next() {
          let x = this.seed;
          x ^= x << 13;
          x ^= x >>> 17;
          x ^= x << 5;
          this.seed = x >>> 0;
          return this.seed / 4294967296;
        }
        range(min, max) {
          return this.next() * (max - min) + min;
        }
        chance(prob) {
          return this.next() < prob;
        }
        int(min, maxExclusive) {
          return Math.floor(this.range(min, maxExclusive));
        }
      }

      const sessionSeed = (() => {
        const params = new URLSearchParams(window.location.search);
        const fromQuery = Number(params.get('seed'));
        if (Number.isFinite(fromQuery) && fromQuery > 0) return fromQuery >>> 0;
        const timeSeed = (Date.now() ^ ((screen.width || W) << 8) ^ (screen.height || H)) >>> 0;
        return timeSeed || CONFIG.seeds.default;
      })();
      const rng = new SeededRNG(sessionSeed);

      function rand(min, max) { return rng.range(min, max); }
      function chance(prob) { return rng.chance(prob); }

      const safeArea = { top: 0, right: 0, bottom: 0, left: 0, isLandscape: false };
      function readSafeInset(side) {
        const probe = document.createElement('div');
        probe.style.position = 'absolute';
        probe.style.visibility = 'hidden';
        probe.style.pointerEvents = 'none';
        probe.style[side === 'top' || side === 'bottom' ? 'height' : 'width'] = `env(safe-area-inset-${side})`;
        document.body.appendChild(probe);
        const rect = probe.getBoundingClientRect();
        probe.remove();
        return Math.round(side === 'top' || side === 'bottom' ? rect.height : rect.width) || 0;
      }
      function detectLandscape() {
        if (window.screen?.orientation?.type) return window.screen.orientation.type.startsWith('landscape');
        if (typeof window.orientation === 'number') return Math.abs(window.orientation) === 90;
        return window.innerWidth > window.innerHeight;
      }
      function updateSafeArea() {
        safeArea.top = readSafeInset('top');
        safeArea.right = readSafeInset('right');
        safeArea.bottom = readSafeInset('bottom');
        safeArea.left = readSafeInset('left');
        safeArea.isLandscape = detectLandscape();
      }
      updateSafeArea();

      const controls = {
        left:  { key: 'left',  x: 56,  y: 0, r: 26, hitR: 34, label: '◀', color: 'rgba(255,255,255,0.14)' },
        right: { key: 'right', x: 118, y: 0, r: 26, hitR: 34, label: '▶', color: 'rgba(255,255,255,0.14)' },
        jump:  { key: 'jump',  x: 202, y: 0, r: 24, hitR: 32, label: '▲', color: 'rgba(99,216,255,0.18)' },
        parry: { key: 'parry', x: 255, y: 0, r: 23, hitR: 31, label: 'P', color: 'rgba(125,255,176,0.16)' },
        punch: { key: 'punch', x: 306, y: 0, r: 21, hitR: 30, label: 'J', color: 'rgba(255,215,90,0.18)' },
        kick:  { key: 'kick',  x: 306, y: 0, r: 24, hitR: 33, label: 'K', color: 'rgba(255,102,127,0.18)' },
        mute:  { key: 'mute',  x: 326, y: 34, r: 17, hitR: 24, label: '♪', color: 'rgba(255,255,255,0.12)' }
      };
      const controlList = Object.values(controls);

      function layoutControls() {
        const isLandscape = safeArea.isLandscape;
        const bottomOffset = isLandscape
          ? CONFIG.world.mobileControlBottomBase + Math.min(18, safeArea.bottom * 0.25)
          : CONFIG.world.mobileControlBottomBase + Math.min(36, safeArea.bottom * 0.5 + CONFIG.world.mobileControlBottomSafeBoost);
        const baseY = H - bottomOffset;
        const leftClusterInset = 56 + Math.min(26, safeArea.left * (isLandscape ? 0.9 : 0.4));
        const rightClusterInset = 54 + Math.min(28, safeArea.right * (isLandscape ? 0.95 : 0.45));
        controls.left.x = leftClusterInset;
        controls.right.x = leftClusterInset + (isLandscape ? 56 : 62);
        controls.jump.x = W - rightClusterInset - (isLandscape ? 112 : 104);
        controls.parry.x = W - rightClusterInset - (isLandscape ? 58 : 51);
        controls.punch.x = W - rightClusterInset;
        controls.kick.x = W - rightClusterInset + (isLandscape ? -2 : 0);
        controls.left.y = baseY;
        controls.right.y = baseY;
        controls.jump.y = baseY;
        controls.parry.y = baseY;
        controls.punch.y = baseY - (isLandscape ? 24 : 32);
        controls.kick.y = baseY + (isLandscape ? 22 : 30);
        controls.mute.x = W - 34 - Math.min(22, safeArea.right * 0.5);
        controls.mute.y = 34 + Math.min(20, safeArea.top * (isLandscape ? 0.15 : 0.25));
      }
      layoutControls();

      function haptic(ms) {
        if (navigator.vibrate) navigator.vibrate(ms);
      }

      function makePlayer() {
        return {
          x: CONFIG.player.startX,
          y: GROUND_Y - CONFIG.player.size.h,
          w: CONFIG.player.size.w,
          h: CONFIG.player.size.h,
          vx: 0,
          vy: 0,
          dir: 1,
          speed: CONFIG.player.speed,
          jumpPower: CONFIG.player.jumpPower,
          gravity: CONFIG.player.gravity,
          onGround: true,
          health: CONFIG.player.health,
          maxHealth: CONFIG.player.health,
          alive: true,
          state: 'idle',
          stateTime: 0,
          attack: null,
          attackCooldowns: { punch: 0, kick: 0 },
          attackLatch: { punch: false, kick: false },
          jumpLatch: false,
          parryLatch: false,
          parryTimer: 0,
          parryCooldown: 0,
          parrySuccess: 0,
          parryGlow: 0,
          parryFailTimer: 0,
          counterWindow: 0,
          invuln: 0,
          hurtTimer: 0,
          hitFlash: 0,
          deathTimer: 0,
          walkCycle: 0,
          bobPhase: 0,
          scorePulse: 0,
          lastGrounded: true,
          animationTime: 0
        };
      }

      function enemyTemplate(type) {
        const map = {
          normal: {
            w: 34, h: 76, health: 34, speed: [90, 116], range: 42, windup: 0.5, cooldown: 0.9,
            damage: 10, worth: 12, color: palette.normal, dark: '#5d2530', projectile: false, poise: 1,
            telegraph: 0.13, dodgeChance: 0
          },
          elite: {
            w: 42, h: 86, health: 58, speed: [76, 96], range: 48, windup: 0.46, cooldown: 0.82,
            damage: 14, worth: 26, color: palette.elite, dark: '#6c3217', projectile: false, poise: 2,
            telegraph: 0.15, dodgeChance: 0.08
          },
          agile: {
            w: 30, h: 70, health: 24, speed: [146, 178], range: 36, windup: 0.25, cooldown: 0.56,
            damage: 7, worth: 18, color: palette.agile, dark: '#20495a', projectile: false, poise: 0.5,
            telegraph: 0.08, dodgeChance: 0.22
          },
          heavy: {
            w: 48, h: 94, health: 94, speed: [54, 68], range: 54, windup: 0.7, cooldown: 1.14,
            damage: 20, worth: 34, color: palette.heavy, dark: '#35286b', projectile: false, poise: 3,
            telegraph: 0.18, dodgeChance: 0
          },
          ranged: {
            w: 34, h: 78, health: 28, speed: [72, 90], range: 120, windup: 0.58, cooldown: 1.08,
            damage: 8, worth: 22, color: palette.ranged, dark: '#1b4b2c', projectile: true, poise: 1,
            telegraph: 0.16, dodgeChance: 0.05
          }
        };
        return map[type];
      }

      function chooseEnemyType(score) {
        const roll = rng.next();
        let type = 'normal';
        if (score > 30 && roll < 0.18) type = 'agile';
        else if (score > 55 && roll < 0.34) type = 'ranged';
        else if (score > 90 && roll < 0.48) type = 'heavy';
        else if (score > 130 && roll < 0.58) type = 'elite';
        else if (score > 45 && roll < 0.32) type = rng.next() < 0.5 ? 'agile' : 'ranged';
        else if (score > 12 && roll < 0.18) type = 'agile';
        return type;
      }

      function spawnEnemy(score) {
        const type = chooseEnemyType(score);
        const t = enemyTemplate(type);
        const speed = rand(t.speed[0], t.speed[1]);
        return {
          type,
          x: W + rand(CONFIG.spawn.spawnOffsetMin, CONFIG.spawn.spawnOffsetMax),
          y: GROUND_Y - t.h,
          w: t.w,
          h: t.h,
          vx: 0,
          vy: 0,
          dir: -1,
          speed,
          baseSpeed: speed,
          health: t.health,
          maxHealth: t.health,
          attackRange: t.range,
          attackWindup: t.windup,
          attackCooldown: rand(0.08, 0.4),
          attackTimer: 0,
          attackPhase: 'ready',
          state: 'walk',
          stateTime: 0,
          hurtTimer: 0,
          hitFlash: 0,
          dead: false,
          deathTimer: 0.55,
          damage: t.damage,
          worth: t.worth,
          color: t.color,
          dark: t.dark,
          poise: t.poise,
          dodgeChance: t.dodgeChance,
          projectile: t.projectile,
          telegraph: t.telegraph,
          stunTimer: 0,
          dodgeTimer: 0,
          shootCooldown: 0,
          lastKnownPlayerX: 0,
          animationTime: 0,
          walkCycle: rand(0, Math.PI * 2)

      }

      function createParticlePool(size) {
        const free = [];
        const active = [];
        for (let i = 0; i < size; i++) {
          free.push({ active: false, x: 0, y: 0, color: '#fff', size: 2, life: 0, maxLife: 0, vx: 0, vy: 0, gravity: 0, alphaBucket: 1 });
        }
        return { free, active, capacity: size };
      }

      const game = {
        seed: sessionSeed,
        player: makePlayer(),
        enemies: [],
        projectiles: [],
        particlePool: createParticlePool(CONFIG.fx.maxParticles),
        flashes: [],
        score: 0,
        time: 0,
        spawnTimer: CONFIG.spawn.initialTimer,
        spawnInterval: CONFIG.spawn.initialInterval,
        comboText: '',
        comboTimer: 0,
        comboCount: 0,
        comboDecay: 0,
        gameOver: false,
        restartTimer: 0,
        cameraShake: 0,
        lastTs: 0,
        accumulatorMs: 0,
        muted: false,
        musicReady: false,
        musicStarted: false,
        audioUnlocked: false,
        audioState: 'locked',
        audioBadgeTimer: 0,
        audioError: '',
        timeScale: 1,
        timeScaleTimer: 0,
        freezeTimer: 0,
        runtimeError: ''
      };

      function resetGame() {
        rng.setSeed(sessionSeed);
        updateSafeArea();
        layoutControls();

      function updateUnmuteButton() {
        if (!unmuteBtn) return;

        unmuteBtn.classList.toggle('is-error', !!game.audioError);
        if (game.audioError) unmuteBtn.textContent = 'UNMUTE (RETRY)';
        else if (game.muted) unmuteBtn.textContent = 'UNMUTE';
        else if (!game.musicStarted || !game.audioUnlocked) unmuteBtn.textContent = 'START AUDIO';
        else unmuteBtn.textContent = 'UNMUTE';
      }

      function audioBadgeText(label) {
        return `AUDIO: ${label.toUpperCase()}`;

      function setAudioBadge(text, state = 'locked', autoHideMs = 0) {
        if (!badge) return;
        badge.textContent = text;
        badge.style.display = 'block';
        badge.classList.remove('is-starting', 'is-live', 'is-error', 'is-hidden');
        game.audioState = state;

        else if (state === 'live') badge.classList.add('is-live');
        else if (state === 'error') badge.classList.add('is-error');
        updateUnmuteButton();
        if (autoHideMs > 0 && state === 'live' && game.audioUnlocked && !game.muted && !game.audioError) {
          window.clearTimeout(setAudioBadge.hideTimer);

            badge.classList.add('is-hidden');

          window.clearTimeout(setAudioBadge.hideTimer);
        }

      setAudioBadge.hideTimer = 0;

      class TinyMusic {
        constructor() {
          this.ctx = null;
          this.master = null;

          this.step = 0;
          this.timer = null;
          this.tempo = CONFIG.audio.tempo;
          this.resumeBound = () => this.resumeIfNeeded().catch((err) => reportRuntimeError('Audio resume failed', err));
          this.scale = {
            C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.0, A4: 440.0,
            C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.0
          };
          this.melody = [
            'G5','A5','E5','D5','E5','G5','A5','E5',
            'D5','E5','G5','E5','D5','C5','D5','E5',
            'G5','A5','E5','D5','E5','G5','D5','E5',
            'A4','C5','D5','E5','D5','C5','A4',null
          ];
          this.bass = [
            'A4',null,'E4',null,'D4',null,'E4',null,
            'A4',null,'E4',null,'D4',null,'C4',null

        ensure() {
          if (this.ctx) return true;
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) {
            game.musicReady = false;
            game.audioError = 'AudioContext unsupported';
            console.error('[KungFuBrawler audio] AudioContext unsupported');
            setAudioBadge(`${audioBadgeText('error')} · unsupported`, 'error');
            return false;
          }
          try {
            this.ctx = new AC();
            console.log('[KungFuBrawler audio] AudioContext created', this.ctx.state);
            game.audioError = '';
            this.master = this.ctx.createGain();
            this.musicGain = this.ctx.createGain();
            this.sfxGain = this.ctx.createGain();
            this.master.gain.value = game.muted ? 0 : CONFIG.audio.masterGain;
            this.musicGain.gain.value = CONFIG.audio.musicGain;
            this.sfxGain.gain.value = CONFIG.audio.sfxGain;
            this.musicGain.connect(this.master);
            this.sfxGain.connect(this.master);
            this.master.connect(this.ctx.destination);
            this.ctx.addEventListener?.('statechange', () => {
              if (!this.ctx) return;
              console.log('[KungFuBrawler audio] statechange ->', this.ctx.state);
              game.audioState = this.ctx.state;
              if (this.ctx.state === 'running') {
                game.audioUnlocked = true;
                game.musicReady = true;
                game.audioError = '';
                setAudioBadge(`${audioBadgeText('running')} · music ${game.musicStarted ? 'on' : 'ready'}`, 'live', game.musicStarted && !game.muted ? CONFIG.audio.badgeLiveHideMs : 0);
              } else if (this.ctx.state === 'suspended') {
                game.audioUnlocked = false;
                setAudioBadge(`${audioBadgeText('suspended')} · tap/click/key`, 'locked');
              } else if (this.ctx.state === 'closed') {
                game.audioUnlocked = false;
                game.audioError = 'AudioContext closed';
                setAudioBadge(`${audioBadgeText('closed')} · retry`, 'error');
              }
            });
            game.musicReady = true;
            game.audioState = this.ctx.state;
            return true;
          } catch (err) {
            console.error('[KungFuBrawler audio] Audio context init failed', err);
            this.ctx = null;
            this.master = null;
            this.musicGain = null;
            this.sfxGain = null;
            game.musicReady = false;
            game.audioError = err?.message || 'Audio init failed';
            setAudioBadge(`${audioBadgeText('error')} · init failed`, 'error');
            return false;
          }
        }
        async resumeIfNeeded() {
          if (!this.ensure() || !this.ctx) return false;
          if (document.visibilityState === 'hidden') return false;
          if (this.ctx.state !== 'running') {
            try {
              console.log('[KungFuBrawler audio] resuming AudioContext from', this.ctx.state);
              await this.ctx.resume();
            } catch (err) {
              console.error('[KungFuBrawler audio] Audio resume blocked', err);
              game.audioError = err?.message || 'Audio resume blocked';
              setAudioBadge(`${audioBadgeText(this.ctx.state || 'blocked')} · tap retry`, 'error');
              return false;
            }
          }
          game.audioUnlocked = this.ctx.state === 'running';
          game.audioState = this.ctx.state;
          if (!game.audioUnlocked) {
            game.audioError = `Audio state: ${this.ctx.state}`;
            setAudioBadge(`${audioBadgeText(this.ctx.state || 'locked')} · tap retry`, 'error');
          } else {
            game.audioError = '';
          }
          return game.audioUnlocked;
        }
        async start() {
          if (!this.ensure() || !this.ctx) return false;
          const resumed = await this.resumeIfNeeded();
          if (!resumed) return false;
          if (this.started) {
            console.log('[KungFuBrawler audio] audio already started', this.ctx.state);
            return true;
          }
          this.started = true;
          game.musicStarted = true;
          game.audioUnlocked = true;
          game.audioError = '';
          this.nextTime = this.ctx.currentTime + 0.05;
          console.log('[KungFuBrawler audio] background music starting at', this.nextTime.toFixed(3));
          this.scheduleLoop();
          return true;
        }
        setMuted(muted) {
          game.muted = muted;
          if (this.master) this.master.gain.value = muted ? 0 : CONFIG.audio.masterGain;
        }
        scheduleLoop() {
          if (!this.ctx || this.ctx.state !== 'running') {
            this.timer = setTimeout(() => this.scheduleLoop(), CONFIG.audio.schedulerMs);
            return;
          }
          const beat = 60 / this.tempo / 2;
          while (this.nextTime < this.ctx.currentTime + this.lookahead) {
            const i = this.step % this.melody.length;
            const bassI = this.step % this.bass.length;
            const note = this.melody[i];
            const bass = this.bass[bassI];
            if (note) this.playSquare(this.scale[note], this.nextTime, beat * 0.84, 0.055, 'melody');
            if (bassI % 2 === 0 && bass) this.playSquare(this.scale[bass] / 2, this.nextTime, beat * 1.2, 0.05, 'bass');
            if (this.step % 2 === 0) this.playNoiseHat(this.nextTime, 0.018, 0.024);
            if (this.step % 8 === 0) this.playKick(this.nextTime, 0.045);
            this.step++;
            this.nextTime += beat;

          this.timer = setTimeout(() => this.scheduleLoop(), CONFIG.audio.schedulerMs);

        cleanupNode(node, time) {
          if (!node) return;
          node.onended = null;
          try { node.stop(time); } catch (_) {}
          node.onended = () => {
            try { node.disconnect(); } catch (_) {}
          };
        }
        connectTransient(source, chain, output, stopTime) {
          if (!source || !output) return;
          let prev = source;
          try {
            for (const node of chain) {
              prev.connect(node);
              prev = node;
            }
            prev.connect(output);
          } catch (err) {
            console.error('Transient audio connect failed', err);
            try { source.disconnect?.(); } catch (_) {}
            for (const node of chain) {
              try { node.disconnect?.(); } catch (_) {}
            }
            return;
          }
          const transientNodes = [source, ...chain];
          let cleaned = false;
          const cleanup = () => {
            if (cleaned) return;
            cleaned = true;
            for (const node of transientNodes) {
              try { node.onended = null; } catch (_) {}
              try { node.disconnect(); } catch (_) {}
            }
          };
          if ('onended' in source) source.onended = cleanup;
          if (typeof stopTime === 'number' && this.ctx) {
            const now = this.ctx.currentTime;
            const safeStopTime = Math.max(stopTime, now + 0.001);
            try {
              source.stop(safeStopTime);
            } catch (err) {
              console.warn('Transient audio stop fallback', err);
              cleanup();
              return;
            }
            setTimeout(cleanup, Math.max(0, (safeStopTime - now) * 1000 + 80));
          }
        }
        createNoiseBuffer(duration) {
          const buffer = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * duration), this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = (rng.next() * 2 - 1) * (1 - i / data.length);
          return buffer;
        }
        playSquare(freq, time, duration, gain = 0.06, mode = 'melody') {
          if (!this.ctx || game.muted) return;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = mode === 'bass' ? 'triangle' : 'square';
          osc.frequency.setValueAtTime(freq, time);
          g.gain.setValueAtTime(0.0001, time);
          g.gain.linearRampToValueAtTime(gain, time + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0001, time + duration);
          this.connectTransient(osc, [g], this.musicGain, time + duration + CONFIG.audio.stopTail);
          osc.start(time);
        }
        playNoiseHat(time, duration = 0.02, gain = 0.02) {
          if (!this.ctx || game.muted) return;
          const src = this.ctx.createBufferSource();
          const filter = this.ctx.createBiquadFilter();
          const g = this.ctx.createGain();
          src.buffer = this.createNoiseBuffer(duration);
          filter.type = 'highpass';
          filter.frequency.value = 2500;
          g.gain.value = gain;
          this.connectTransient(src, [filter, g], this.musicGain, time + duration + CONFIG.audio.stopTail);
          src.start(time);
        }
        playKick(time, gain = 0.05) {
          if (!this.ctx || game.muted) return;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(120, time);
          osc.frequency.exponentialRampToValueAtTime(44, time + 0.08);
          g.gain.setValueAtTime(gain, time);
          g.gain.exponentialRampToValueAtTime(0.0001, time + CONFIG.audio.kickTail);

            this.tone(now, 180, 110, 0.06, 'square', 0.07);
            this.noise(now, 0.05, 0.03, 1100, 0.04);
          } else if (type === 'kick') {
            this.tone(now, 150, 72, 0.1, 'triangle', 0.09);
            this.noise(now, 0.06, 0.034, 900, 0.05);
          } else if (type === 'hurt') {
            this.tone(now, 200, 90, 0.12, 'sawtooth', 0.055);
          } else if (type === 'parryReady') {
            this.tone(now, 360, 460, 0.06, 'triangle', 0.04);
            this.tone(now + 0.025, 460, 560, 0.05, 'square', 0.03);
          } else if (type === 'parrySuccess') {
            this.tone(now, 520, 980, 0.14, 'square', 0.09);
            this.tone(now + 0.018, 660, 1320, 0.16, 'triangle', 0.06);
            this.noise(now, 0.045, 0.018, 2400, 0.8);
          } else if (type === 'parryProjectile') {
            this.tone(now, 460, 1080, 0.16, 'square', 0.09);
            this.tone(now + 0.02, 620, 1440, 0.18, 'triangle', 0.06);
            this.noise(now, 0.06, 0.022, 2600, 1.2);
          } else if (type === 'parryFail') {
            this.tone(now, 220, 150, 0.08, 'sawtooth', 0.045);
          } else if (type === 'death') {
            this.tone(now, 220, 70, 0.22, 'square', 0.06);
          } else if (type === 'throw') {
            this.tone(now, 460, 220, 0.08, 'triangle', 0.05);
          }

          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();

          osc.frequency.setValueAtTime(from, time);
          osc.frequency.exponentialRampToValueAtTime(Math.max(1, to), time + duration);
          g.gain.setValueAtTime(gain, time);
          g.gain.exponentialRampToValueAtTime(0.0001, time + duration);
          this.connectTransient(osc, [g], this.sfxGain, time + duration + CONFIG.audio.stopTail);

          filter.type = 'bandpass';
          filter.frequency.value = cutoff;
          filter.Q.value = q;
          g.gain.value = gain;
          this.connectTransient(src, [filter, g], this.sfxGain, time + duration + CONFIG.audio.stopTail);
